rules:
  - id: detect-vercel-ai
    languages:
      - js
      - ts
    severity: INFO
    message: "detect-vercel-ai 잠재적 결함 및 보안 이격율 정비 요망."
    pattern-either:
      - pattern: import "ai"
      - pattern: import "@ai-sdk"
      - pattern: generateText({model:...})
      - pattern: generateText({prompt:...})
    metadata:
      references:
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: maintainability
      technology:
        - genAI
        - LLMs
      confidence: LOW