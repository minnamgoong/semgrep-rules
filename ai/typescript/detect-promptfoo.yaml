rules:
  - id: detect-promptfoo
    languages:
      - js
      - ts
    severity: INFO
    message: "detect-promptfoo 잠재적 결함 및 보안 이격율 정비 요망."
    pattern-either:
      - pattern: import "promptfoo"
      - pattern: promptfoo.evaluate(...)
    metadata:
      references:
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: maintainability
      technology:
        - genAI
        - LLMs
      confidence: LOW