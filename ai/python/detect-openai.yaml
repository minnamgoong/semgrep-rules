rules:
  - id: detect-openai
    languages:
      - python
    severity: INFO
    message: "detect-openai 잠재적 결함 및 보안 이격율 정비 요망."
    pattern-either:
      - pattern: import openai
      - pattern: from openai import $ANYTHING
      - pattern: OpenAI(...)
      - pattern: $CLIENT.chat.completions.$FUNC(...)
    metadata:
      references:
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: maintainability
      technology:
        - genAI
        - LLMs
      confidence: LOW