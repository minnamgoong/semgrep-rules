rules:
  - id: detect-anthropic
    languages:
      - python
    severity: INFO
    message: "detect-anthropic 잠재적 결함 및 보안 이격율 정비 요망."
    pattern-either:
      - pattern: import anthropic
      - pattern: from anthropic import $ANYTHING
      - pattern: Anthropic(...)
      - pattern: anthropic.Anthropic(...)
      - pattern: $CLIENT.messages.$FUNC(...,model=...,...)
    metadata:
      references:
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: maintainability
      technology:
        - genAI
        - LLMs
      confidence: LOW