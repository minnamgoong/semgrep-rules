rules:
  - id: detect-pytorch
    languages:
      - python
    severity: INFO
    message: "detect-pytorch 잠재적 결함 및 보안 이격율 정비 요망."
    pattern-either:
      - pattern: import torch
      - pattern: torch.$FUNC(...)
    metadata:
      references:
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: maintainability
      technology:
        - genAI
        - LLMs
      confidence: LOW