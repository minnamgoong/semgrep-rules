rules:
- id: detect-generic-ai-gem
  languages:
  - generic
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: maintainability
    confidence: LOW
    references:
    - https://semgrep.dev/blog/2024/detecting-shadow-ai
    technology:
    - genAI
    - LLMs
  pattern-either:
  - pattern: google/generative-ai
  - pattern: GoogleGenerativeAI
  severity: INFO
