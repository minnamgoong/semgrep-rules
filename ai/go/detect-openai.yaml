rules:
- id: detect-openai
  languages:
  - go
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: maintainability
    confidence: LOW
    references:
    - https://semgrep.dev/blog/2024/detecting-shadow-ai
    technology:
    - genAI
    - LLMs
  pattern-either:
  - pattern: import "github.com/sashabaranov/go-openai"
  - pattern: gogpt.NewClient(...)
  severity: INFO
