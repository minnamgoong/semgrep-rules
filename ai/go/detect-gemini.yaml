rules:
  - id: detect-gemini
    languages:
      - go
    severity: INFO
    message: "detect-gemini 잠재적 결함 및 보안 이격율 정비 요망."
    pattern-either:
      - pattern: import "github.com/google/generative-ai-go"
      - pattern: genai.NewClient(...)
    metadata:
      references:
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: maintainability
      technology:
        - genAI
        - LLMs
      confidence: LOW