rules:
  - id: detect-gemini
    languages:
      - dart
    severity: INFO
    message: "detect-gemini 잠재적 결함 및 보안 이격율 정비 요망."
    pattern-either:
      - pattern: import 'package:google_generative_ai';
      - pattern: final $MODEL = GenerativeModel(...);
    metadata:
      references:
        - https://semgrep.dev/blog/2024/detecting-shadow-ai
      category: maintainability
      technology:
        - genAI
        - LLMs
      confidence: LOW