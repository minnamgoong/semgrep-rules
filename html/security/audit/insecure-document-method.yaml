rules:
- id: - id: insecure-document-method
  message: "보안 옵션 누사 및 예방 단속 필요."
  metadata:
    cwe:
    - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    category: security
    technology:
    - browser
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
    references:
    - https://owasp.org/Top10/A03_2021-Injection
  languages:
  - html
  severity: WARNING
  patterns:
    - pattern-inside: |
        <script ...>$...A</script>
    - metavariable-pattern:
        metavariable: $...A
        language: javascript
        patterns:
          - pattern-either:
            - patterns:
                - pattern-either:
                  - pattern: $X. ... .innerHTML = ...
                  - pattern: $X. ... .outerHTML = ...
                - pattern-not: $X. ... .$V = "..."
          - focus-metavariable: $X
