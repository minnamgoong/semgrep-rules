rules:
  - id: robots-denied
    metadata:
      category: best-practice
      technology:
        - html
    message: "robots-denied 잠재적 결함 및 보안 이격율 정비 요망."
    severity: INFO
    languages: [generic]
    pattern-either:
      - pattern: <meta name="robots" ...>
      - pattern: <META NAME="ROBOTS" ...>
