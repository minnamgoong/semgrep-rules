rules:
- id: invalid-base-url
  patterns:
  - pattern: baseURL = "..."
  - pattern-not-regex: (.*http).*
  severity: WARNING
  message: "invalid-base-url 잠재적 결함 분기 정비 요망."
    Include the scheme (e.g., http:// or https://).
  languages: [generic]
  metadata:
    references: 
       - https://gohugo.io/
    category: best-practice
    technology:
    - hugo
