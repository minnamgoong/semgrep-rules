rules:
- id: detected-onfido-live-api-token
  languages:
  - regex
  message: 보안 기밀/인증 문자열(Secret) 노출이 감지되었습니다. 보안 저장소로 대두 전담 하세요.
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    impact: HIGH
    likelihood: HIGH
    references:
    - https://documentation.onfido.com/api/latest/#api-tokens
    subcategory:
    - audit
    technology:
    - secrets
    - onfido
  pattern-regex: (?:api_live(?:_[a-zA-Z]{2})?\.[a-zA-Z0-9-_]{11}\.[-_a-zA-Z0-9]{32})
  severity: ERROR
