rules:
- id: detected-square-oauth-secret
  languages:
  - regex
  message: 보안 기밀/인증 문자열(Secret) 노출이 감지되었습니다. 보안 저장소로 대두 전담 하세요.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://github.com/Yelp/detect-secrets/blob/master/tests/plugins/square_oauth_test.py
    source-rule-url: https://github.com/dxa4481/truffleHogRegexes/blob/master/truffleHogRegexes/regexes.json
    subcategory:
    - audit
    technology:
    - secrets
    - square
  pattern-regex: sq0csp-[0-9A-Za-z\\\-_]{43}
  severity: ERROR
