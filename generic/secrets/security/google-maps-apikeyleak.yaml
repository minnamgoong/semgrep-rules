rules:
- id: google-maps-apikeyleak
  languages:
  - generic
  message: 코드에서 잠재적인 Google Maps API 키를 감지합니다.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-538: Insertion of Sensitive Information into Externally-Accessible File
      or Directory'
    description: Detects potential Google Maps API keys in code
    impact: HIGH
    likelihood: MEDIUM
    owasp:
    - A3:2017 Sensitive Data Exposure
    references:
    - https://ozguralp.medium.com/unauthorized-google-maps-api-key-usage-cases-and-why-you-need-to-care-1ccb28bf21e
    severity: MEDIUM
    subcategory:
    - audit
    technology:
    - Google Maps
  patterns:
  - pattern-regex: ^(AIza[0-9A-Za-z_-]{35}(?!\S))$
  severity: WARNING
