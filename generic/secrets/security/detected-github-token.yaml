rules:
- id: detected-github-token
  languages:
  - generic
  message: GitHub 토큰 자격증명이 노출되었습니다.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
    source-rule-url: https://github.blog/changelog/2021-03-04-authentication-token-format-updates/
    subcategory:
    - audit
    technology:
    - secrets
    - github
  patterns:
  - pattern-either:
    - pattern: '$VAR = $SECRET

        '
    - pattern: '$VAR: $SECRET

        '
    - pattern: '$VAR = ''$SECRET''

        '
    - pattern: '$VAR: ''$SECRET''

        '
    - pattern: '''$VAR'' = ''$SECRET''

        '
    - pattern: '''$VAR'': ''$SECRET''

        '
    - pattern: '"[hH][tT][tT][pP][sS]?://.*$SECRET.*"

        '
  - metavariable-regex:
      metavariable: $SECRET
      regex: gh[pousr]_[A-Za-z0-9_]{36,251}
  - metavariable-analysis:
      analyzer: entropy
      metavariable: $SECRET
  severity: ERROR
