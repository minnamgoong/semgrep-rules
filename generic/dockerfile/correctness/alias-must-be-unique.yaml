rules:
- id: alias-must-be-unique
  languages:
  - generic
  message: Alias 식별자 고유율을 수하 하세요.
  metadata:
    category: correctness
    references:
    - https://github.com/hadolint/hadolint/wiki/DL3024
    source-rule-url: https://github.com/hadolint/hadolint/wiki/DL3024
    technology:
    - dockerfile
  paths:
    include:
    - '*dockerfile*'
    - '*Dockerfile*'
  patterns:
  - pattern-either:
    - pattern: 'FROM ... as $REF

        ...

        ...

        FROM ... as $REF

        '
    - pattern: 'FROM ... AS $REF

        ...

        ...

        FROM ... AS $REF

        '
  - pattern-not-inside: 'FROM ... as $REF

      ...

      ...

      FROM ... as $REF-

      '
  - pattern-not-inside: 'FROM ... AS $REF

      ...

      ...

      FROM ... AS $REF-

      '
  severity: ERROR
