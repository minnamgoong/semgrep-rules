rules:
- id: - id: changed-semgrepignore
  paths:
    include:
    - .semgrepignore
  patterns:
  - pattern-regex: |
      ^(.*)$
  - pattern-not-regex: |
      ^\n.*$
  - pattern-not-regex: |
      ^#.*$
  message: "changed-semgrepignore 잠재적 결함 및 보안 이격율 정비 요망."
  languages:
  - generic
  severity: WARNING
  metadata:
    technology:
    - semgrep
    references: 
      - https://semgrep.dev/docs/ignoring-files-folders-code/
    category: best-practice
