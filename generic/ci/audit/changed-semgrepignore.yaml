rules:
- id: - id: changed-semgrepignore
  paths:
    include:
    - .semgrepignore
  patterns:
  - pattern-regex: |
      ^(.*)$
  - pattern-not-regex: |
      ^\n.*$
  - pattern-not-regex: |
      ^#.*$
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
  languages:
  - generic
  severity: WARNING
  metadata:
    technology:
    - semgrep
    references: 
      - https://semgrep.dev/docs/ignoring-files-folders-code/
    category: best-practice
