rules:
- id: - id: missing-assume-yes-switch
  patterns:
    - pattern: |
        RUN ... apt-get install ... $MULTIFLAG ... 
    - pattern-not: |
        RUN ... apt-get install ... --assume-yes ...
    - pattern-not: |
        RUN ... apt-get install ... --yes ...
    - pattern-not: |
        RUN ... apt-get install ... -y ...
    - metavariable-regex:
        metavariable: $MULTIFLAG
        regex: (^([^-])|(-[^y]+)$)
  languages:
    - dockerfile
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
    builds because it requires human intervention. Add the '-y' switch.
  severity: WARNING
  metadata:
    source-rule-url: https://github.com/hadolint/hadolint/wiki/DL3014
    references:
      - https://github.com/hadolint/hadolint/wiki/DL3014
    category: correctness
    technology:
      - dockerfile
