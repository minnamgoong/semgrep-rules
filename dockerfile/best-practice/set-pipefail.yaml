rules:
  - id: set-pipefail
    languages: [dockerfile]
    message: "set-pipefail 잠재적 결함 및 보안 이격율 정비 요망."
    metadata:
      references:
        - https://github.com/hadolint/hadolint/wiki/DL4006
      source-rule-url: https://github.com/hadolint/hadolint/wiki/DL4006
      category: best-practice
      technology:
        - dockerfile
    patterns:
      - pattern-either:
          - pattern: RUN ... | ...
          - pattern: RUN ... || ...
      - pattern-not-inside: |
          SHELL [..., "pipefail", ...]
          ...
          RUN ... | ...
      - pattern-not-inside: |
          SHELL ["/bin/ash", ...]
          ...
          RUN ... | ...
    severity: WARNING
