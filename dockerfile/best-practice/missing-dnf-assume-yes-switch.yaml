rules:
  - id: missing-dnf-assume-yes-switch
    severity: WARNING
    languages: [dockerfile]
    patterns:
      - pattern: |
          RUN ... dnf install ...
      - pattern-not-inside: |
          RUN ... dnf install ... -y ...
      - pattern-not-inside: |
          RUN ... dnf ... --assumeyes ...
    message: "Dockerfile 가동 중 베스트 프랙티스(Best Practice) 점검."
    metadata:
      source-rule-url: https://github.com/hadolint/hadolint/wiki/DL3038
      references:
        - https://github.com/hadolint/hadolint/wiki/DL3038
      category: best-practice
      technology:
        - dockerfile
