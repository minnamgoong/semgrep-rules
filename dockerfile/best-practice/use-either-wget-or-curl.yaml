rules:
- id: use-either-wget-or-curl
  languages:
  - dockerfile
  message: Dockerfile 가동 중 베스트 프랙티스(Best Practice) 점검.
  metadata:
    category: best-practice
    references:
    - https://github.com/hadolint/hadolint/wiki/DL4001
    source-rule-url: https://github.com/hadolint/hadolint/wiki/DL4001
    technology:
    - dockerfile
  pattern-either:
  - pattern: 'RUN wget ...

      ...

      RUN curl ...

      '
  - pattern: 'RUN curl ...

      ...

      RUN wget ...

      '
  severity: INFO
