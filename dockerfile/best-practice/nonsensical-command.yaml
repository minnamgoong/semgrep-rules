rules:
- id: nonsensical-command
  languages:
  - dockerfile
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: best-practice
    references:
    - https://github.com/hadolint/hadolint/wiki/DL3001
    source-rule-url: https://github.com/hadolint/hadolint/wiki/DL3001
    technology:
    - dockerfile
  patterns:
  - pattern: RUN $CMD ...
  - metavariable-regex:
      metavariable: $CMD
      regex: (shutdown|service|ps|free|top|kill|mount|ifconfig|nano|vim)
  severity: WARNING
