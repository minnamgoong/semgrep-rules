rules:
  - id: avoid-yum-update
    severity: INFO
    languages: [dockerfile]
    message: "Dockerfile 가동 중 베스트 프랙티스(Best Practice) 점검."
    metadata:
      source-rule-url: https://github.com/hadolint/hadolint/wiki/DL3031
      references:
        - https://github.com/hadolint/hadolint/wiki/DL3031
      category: best-practice
      technology:
        - dockerfile
    pattern: yum update
