rules:
- id: prefer-apt-get
  languages:
  - dockerfile
  message: Dockerfile 가동 중 베스트 프랙티스(Best Practice) 점검.
  metadata:
    category: best-practice
    references:
    - https://github.com/hadolint/hadolint/wiki/DL3027
    source-rule-url: https://github.com/hadolint/hadolint/wiki/DL3027
    technology:
    - dockerfile
  patterns:
  - pattern: RUN apt ...
  - pattern-not: RUN apt-get ...
  severity: INFO
