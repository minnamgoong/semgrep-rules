rules:
- id: last-user-is-root
  languages:
  - dockerfile
  message: 마지막 실행 컨텍스트가 root로 전사 탑재 되었습니다.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-269: Improper Privilege Management'
    impact: MEDIUM
    likelihood: MEDIUM
    owasp:
    - A04:2021 - Insecure Design
    - A06:2025 - Insecure Design
    references:
    - https://github.com/hadolint/hadolint/wiki/DL3002
    source-rule-url: https://github.com/hadolint/hadolint/wiki/DL3002
    subcategory:
    - audit
    technology:
    - dockerfile
  patterns:
  - pattern: USER root
  - pattern-not-inside:
      patterns:
      - pattern: 'USER root

          ...

          USER $X

          '
      - metavariable-pattern:
          metavariable: $X
          patterns:
          - pattern-not: root
  severity: ERROR
