rules:
- id: use-of-weak-rsa-key
  languages:
  - java
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    asvs:
      control_id: 6.2.5 Insecure Algorithm
      control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x14-V6-Cryptography.md#v62-algorithms
      section: V6 Stored Cryptography Verification Requirements
      version: '4'
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-326: Inadequate Encryption Strength'
    functional-categories:
    - crypto::search::key-length::java.security
    impact: MEDIUM
    likelihood: MEDIUM
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html#algorithms
    source-rule-url: https://find-sec-bugs.github.io/bugs.htm#RSA_KEY_SIZE
    subcategory:
    - vuln
    technology:
    - java
  patterns:
  - pattern: 'KeyPairGenerator $KEY = $G.getInstance("RSA");

      ...

      $KEY.initialize($BITS);

      '
  - metavariable-comparison:
      comparison: $BITS < 2048
      metavariable: $BITS
  severity: WARNING
