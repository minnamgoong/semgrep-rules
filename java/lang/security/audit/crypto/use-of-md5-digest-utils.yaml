rules:
- fix: 'getSha512Digest

    '
  id: use-of-md5-digest-utils
  languages:
  - java
  message: 취약한 해시 알고리즘(MD5) 사용이 식별되었습니다. 보안 무결성을 위해 SHA-256 이상을 고르세요.
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-328: Use of Weak Hash'
    functional-categories:
    - crypto::search::hash-algorithm::org.apache.commons
    impact: MEDIUM
    likelihood: MEDIUM
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
    source-rule-url: https://find-sec-bugs.github.io/bugs.htm#WEAK_MESSAGE_DIGEST_MD5
    subcategory:
    - vuln
    technology:
    - java
  patterns:
  - pattern: '$DU.$GET_ALGO().digest(...)

      '
  - metavariable-pattern:
      metavariable: $GET_ALGO
      pattern: getMd5Digest
  - metavariable-pattern:
      metavariable: $DU
      pattern: DigestUtils
  - focus-metavariable: $GET_ALGO
  severity: WARNING
