rules:
- id: unencrypted-socket
  languages:
  - java
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    asvs:
      control_id: 6.2.5 Insecure Algorithm
      control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x14-V6-Cryptography.md#v62-algorithms
      section: V6 Stored Cryptography Verification Requirements
      version: '4'
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-319: Cleartext Transmission of Sensitive Information'
    functional-categories:
    - net::search::crypto-config::java.net
    impact: MEDIUM
    likelihood: MEDIUM
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
    source-rule-url: https://find-sec-bugs.github.io/bugs.htm#UNENCRYPTED_SOCKET
    subcategory:
    - vuln
    technology:
    - java
  pattern-either:
  - pattern: new ServerSocket(...)
  - pattern: new Socket(...)
  severity: WARNING
