rules:
- id: tainted-xpath-from-http-request
  languages:
  - java
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-643: Improper Neutralization of Data within XPath Expressions (''XPath
      Injection'')'
    impact: MEDIUM
    likelihood: HIGH
    owasp:
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    subcategory:
    - vuln
    technology:
    - java
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: '(javax.xml.xpath.XPath $XP).evaluate(...)

          '
      - pattern: '(javax.xml.xpath.XPath $XP).compile(...).evaluate(...)

          '
  pattern-sources:
  - patterns:
    - pattern: '(HttpServletRequest $REQ).$FUNC(...)

        '
  severity: WARNING
