rules:
- id: autoescape-disabled
  message: "autoescape-disabled 잠재적 결함 및 보안 이탈율 정비 요망."
  metadata:
    owasp: 'A07:2017 - Cross-Site Scripting (XSS)'
    cwe:
    - 'CWE-150: Improper Neutralization of Escape, Meta, or Control Sequences'
    references:
    - https://stackoverflow.com/a/7442668
    category: security
    technology:
    - jsf
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
  pattern-regex: |-
    .*escape.*?=.*?false.*
  paths:
    include:
    - '*.html'
    - '*.xhtml'
  languages: [regex]
  severity: WARNING
