rules:
- id: crlf-injection-logs
  languages:
  - java
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-93: Improper Neutralization of CRLF Sequences (''CRLF Injection'')'
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    source-rule-url: https://find-sec-bugs.github.io/bugs.htm#CRLF_INJECTION_LOGS
    subcategory:
    - vuln
    technology:
    - java
  patterns:
  - pattern-either:
    - patterns:
      - pattern-inside: "class $CLASS {\n  ...\n  Logger $LOG = ...;\n  ...\n}\n"
      - pattern-either:
        - pattern-inside: "$X $METHOD(...,HttpServletRequest $REQ,...) {\n  ...\n\
            }\n"
        - pattern-inside: "$X $METHOD(...,ServletRequest $REQ,...) {\n  ...\n}\n"
        - pattern-inside: "$X $METHOD(...) {\n  ...\n  HttpServletRequest $REQ = ...;\n\
            \  ...\n}\n"
        - pattern-inside: "$X $METHOD(...) {\n  ...\n  ServletRequest $REQ = ...;\n\
            \  ...\n}\n"
    - pattern-inside: "$X $METHOD(...) {\n  ...\n  Logger $LOG = ...;\n  ...\n  HttpServletRequest\
        \ $REQ = ...;\n  ...\n}\n"
    - pattern-inside: "$X $METHOD(...) {\n  ...\n  Logger $LOG = ...;\n  ...\n  ServletRequest\
        \ $REQ = ...;\n  ...\n}\n"
  - pattern-either:
    - pattern: 'String $VAL = $REQ.getParameter(...);

        ...

        $LOG.$LEVEL(<... $VAL ...>);

        '
    - pattern: 'String $VAL = $REQ.getParameter(...);

        ...

        $LOG.log($LEVEL,<... $VAL ...>);

        '
    - pattern: '$LOG.$LEVEL(<... $REQ.getParameter(...) ...>);

        '
    - pattern: '$LOG.log($LEVEL,<... $REQ.getParameter(...) ...>);

        '
  severity: WARNING
