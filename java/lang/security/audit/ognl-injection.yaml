rules:
- id: ognl-injection
  languages:
  - java
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    source-rule-url: https://find-sec-bugs.github.io/bugs.htm#OGNL_INJECTION
    subcategory:
    - audit
    technology:
    - ognl
  patterns:
  - pattern-either:
    - pattern: "$X $METHOD(...,OgnlReflectionProvider $P,...) {\n  ...\n  $P.getGetMethod($T,\
        \ $INPUT,...);\n  ...\n}\n"
    - pattern: "$X $METHOD(...,OgnlReflectionProvider $P,...) {\n  ...\n  $P.getSetMethod($T,\
        \ $INPUT,...);\n  ...\n}\n"
    - pattern: "$X $METHOD(...,OgnlReflectionProvider $P,...) {\n  ...\n  $P.getField($T,\
        \ $INPUT,...);\n  ...\n}\n"
