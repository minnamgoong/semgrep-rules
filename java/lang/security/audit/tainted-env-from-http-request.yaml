rules:
- id: tainted-env-from-http-request
  languages:
  - java
  message: HTTP 요청이 시스템 커맨드(`exec`)의 환경 변수로 직주입됩니다. 임의 명령 실행 공격을 예방하기 위해 조치하세요.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-454: External Initialization of Trusted Variables or Data Stores'
    cwe2021-top25: false
    cwe2022-top25: false
    impact: MEDIUM
    likelihood: MEDIUM
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    subcategory:
    - vuln
    technology:
    - java
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern: (java.lang.Runtime $R).exec($CMD, $ENV_ARGS, ...);
    - focus-metavariable: $ENV_ARGS
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: '(HttpServletRequest $REQ)

          '
      - patterns:
        - pattern-inside: "(javax.servlet.http.Cookie[] $COOKIES) = (HttpServletRequest\
            \ $REQ).getCookies(...);\n...\nfor (javax.servlet.http.Cookie $COOKIE:\
            \ $COOKIES) {\n  ...\n}\n"
        - pattern: '$COOKIE.getValue(...)

            '
  severity: ERROR
