rules:
- id: java-pattern-from-string-parameter
  languages:
  - java
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-1333: Inefficient Regular Expression Complexity'
    impact: LOW
    likelihood: LOW
    owasp:
    - A03:2021 Injection
    references:
    - https://en.wikipedia.org/wiki/ReDoS
    - https://learn.snyk.io/lesson/redos
    subcategory:
    - audit
    technology:
    - java
  paths:
    include:
    - '**/*.java'
  patterns:
  - pattern-inside: "$TYPE $METHOD(..., String $PARAM, ...) {\n  ...\n}"
  - pattern-either:
    - pattern: java.util.regex.Pattern.matches($PARAM, $ANY_STRING_TO_MATCH)
    - pattern: java.util.regex.Pattern.compile($PARAM,...)
  severity: INFO
