rules:
  - id: no-string-eqeq
    languages: [java]
    patterns:
      - pattern-not: null == (String $Y)
      - pattern: $X == (String $Y)
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
    severity: WARNING
    metadata:
      category: correctness
      technology:
        - java
