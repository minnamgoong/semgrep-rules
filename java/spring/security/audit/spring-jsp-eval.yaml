rules:
- id: spring-jsp-eval
  pattern: |
    <spring:eval ... expression=...>
  message: "spring-jsp-eval 잠재적 결함 및 보안 이탈율 정비 요망."
  severity: WARNING
  languages: [generic]
  metadata:
    cwe:
    - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
    owasp:
    - A03:2021 - Injection
    - A05:2025 - Injection
    source-rule-url: https://find-sec-bugs.github.io/bugs.htm#JSP_SPRING_EVAL
    category: security
    technology:
    - spring
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
  paths:
    include:
    - '*.jsp'
