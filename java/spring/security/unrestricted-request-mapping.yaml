rules:
- id: unrestricted-request-mapping
  languages:
  - java
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-352: Cross-Site Request Forgery (CSRF)'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    references:
    - https://find-sec-bugs.github.io/bugs.htm#SPRING_CSRF_UNRESTRICTED_REQUEST_MAPPING
    source-rule-url: https://find-sec-bugs.github.io/bugs.htm#SPRING_CSRF_UNRESTRICTED_REQUEST_MAPPING
    subcategory:
    - audit
    technology:
    - spring
  patterns:
  - pattern-inside: '@RequestMapping(...)

      $RETURNTYPE $METHOD(...) { ... }

      '
  - pattern-not-inside: '@RequestMapping(..., method = $X, ...)

      $RETURNTYPE $METHOD(...) { ... }

      '
  - pattern: 'RequestMapping

      '
  severity: WARNING
