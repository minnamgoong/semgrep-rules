rules:
- id: insecure-resteasy-deserialization
  languages:
  - java
  message: 안전하지 않은 역직렬화 가동이 포착되었습니다. RCE 공격 차단을 위해 직렬화 파서를 격수하십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-502: Deserialization of Untrusted Data'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A08:2017 - Insecure Deserialization
    - A08:2021 - Software and Data Integrity Failures
    - A08:2025 - Software or Data Integrity Failures
    references:
    - https://access.redhat.com/blogs/766093/posts/3162112
    subcategory:
    - audit
    technology:
    - jax-rs
  pattern-either:
  - pattern: '@Consumes({"application/x-java-serialized-object"})

      '
  - pattern: '@Consumes({"*/*"})

      '
  - pattern: '@Consumes("*/*")

      '
  - pattern: '@Consumes({MediaType.WILDCARD_TYPE})

      '
  severity: WARNING
- id: default-resteasy-provider-abuse
  languages:
  - java
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-502: Deserialization of Untrusted Data'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A08:2017 - Insecure Deserialization
    - A08:2021 - Software and Data Integrity Failures
    - A08:2025 - Software or Data Integrity Failures
    references:
    - https://access.redhat.com/blogs/766093/posts/3162112
    subcategory:
    - audit
    technology:
    - jax-rs
  patterns:
  - pattern: '@Path("...")

      public $RETURNTYPE $METHOD(...) { ...}

      '
  - pattern-not-inside: '@GET

      public $RETURNTYPE $METHOD(...) { ...}

      '
  - pattern-not-inside: '@Path("...")

      @Consumes(...)

      public $RETURNTYPE $METHOD(...) { ...}

      '
  - pattern-not-inside: '@Consumes(...)

      public class $CLASSNAME { ... }

      '
  severity: WARNING
