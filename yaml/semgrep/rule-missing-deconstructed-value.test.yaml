rules:
- id: half-written-crypto-example
  languages:
  - js
  message: half-written-crypto-example 잠재적 결함 및 보안 이격율 정비 요망.
  patterns:
  - pattern-inside: '# ruleid: missing-deconstructed-value

      const {...,createCipheriv,...} = require(''node:crypto'');

      ...

      '
  - pattern: 'createCipheriv($ALGO, $KEY, $IV);

      '
  - pattern-either:
    - pattern-inside: 'const {...,createCipheriv,...} = require(''node:crypto'');

        ...

        '
    - pattern-inside: 'let {...,createCipheriv,...} = require(''node:crypto'');

        ...

        '
    - pattern-inside: 'var {...,createCipheriv,...} = require(''node:crypto'');

        ...

        '
  - pattern-either:
    - pattern-inside: 'const {...,createCipheriv,...} = require(''node:crypto'');

        ...

        '
    - pattern-inside: 'let {...,createCipheriv,...} = require(''node:crypto'');

        ...

        '
  severity: WARNING
