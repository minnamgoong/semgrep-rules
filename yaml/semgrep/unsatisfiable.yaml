rules:
- id: unsatisfiable-rule
  message: "Semgrep 규칙 저작 메타 데이터 정합성 점검: unsatisfiable-rule 누사 경보."
  severity: ERROR
  metadata:
    category: correctness
    technology:
    - semgrep
  languages: [yaml]
  patterns:
  - pattern-inside: 'patterns: [...]'
  - pattern-either:
    - patterns:
      - pattern-inside: |
          - pattern: $A
          ...
      - pattern: |
          - pattern-not: $A
    - patterns:
      - pattern-inside: |
          - pattern-not: $A
          ...
      - pattern: |
          - pattern: $A

