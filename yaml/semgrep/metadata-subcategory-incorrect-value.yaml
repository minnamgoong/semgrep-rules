rules:
- id: - id: metadata-subcategory-incorrect-value
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
    Semgrep rule likelihood: $VALUE detected, but the value must be vuln, audit, or secure default. For
    more information visit: https://semgrep.dev/docs/contributing/contributing-to-semgrep-rules-repository/
  severity: WARNING
  metadata:
    category: correctness
    references:
    - https://semgrep.dev/docs/contributing/contributing-to-semgrep-rules-repository/
    technology:
    - semgrep
  languages:
  - yaml
  patterns:
  - pattern-inside: |
      rules: 
        ...
  - pattern-inside: |
      metadata: 
        ...
        category: security
        ...
  - pattern: |
      subcategory: 
        - $VALUE
  - pattern-not: |
      subcategory: 
        - vuln
  - pattern-not: |
      subcategory: 
        - audit
  - pattern-not: |
      subcategory: 
        - secure default

