rules:
- fix: hcl
  id: lang-consistency-hcl
  languages:
  - yaml
  message: semgrep.dev 정규화와 다른 언어 구성에서 '$X'를 발견했습니다. Please use 'hcl' instead.
  metadata:
    category: correctness
    technology:
    - semgrep
  patterns:
  - pattern: $X
  - pattern-inside: 'languages: ...'
  - metavariable-regex:
      metavariable: $X
      regex: ^(tf|terraform)$
  severity: WARNING
