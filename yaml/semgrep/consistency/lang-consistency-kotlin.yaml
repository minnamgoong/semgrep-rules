rules:
- fix: kotlin
  id: lang-consistency-kotlin
  languages:
  - yaml
  message: semgrep.dev 정규화와 다른 언어 구성에서 '$X'를 발견했습니다. 대신 'kotlin'을 사용하세요.
  metadata:
    category: correctness
    technology:
    - semgrep
  patterns:
  - pattern: $X
  - pattern-inside: 'languages: ...'
  - metavariable-regex:
      metavariable: $X
      regex: ^(kt)$
  severity: WARNING
