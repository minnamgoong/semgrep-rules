rules:
- id: - id: missing-deconstructed-value
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
  severity: WARNING
  metadata:
    category: correctness
    references:
    - https://semgrep.dev/docs/contributing/contributing-to-semgrep-rules-repository
    technology:
    - semgrep
  languages:
  - yaml
  patterns:
  - pattern-either:
    - patterns:
      - pattern-inside: |
          rules: ...
      - pattern-not-inside: |
          - pattern-either:
              ...
      - pattern: |
          - pattern-inside:
              $VALUE
      - pattern-either:
        - pattern-regex: const {.*}.*=
        - pattern-regex: let {.*}.*=
        - pattern-regex: var {.*}.*=
    - patterns:
      - patterns:
        - pattern-inside: |
            rules: ...
        - pattern-inside: |
            - pattern-either:
                $VALUE
        - focus-metavariable:
          - $VALUE
        - pattern-inside: |
            - pattern-inside: 
                $A
        - metavariable-regex:
            metavariable: $A
            regex: .*\s.*(var|const|let)\s{.*}\s=
      - pattern-not:
          patterns:
          - pattern-inside: |
              ...
              - pattern-inside: 
                  $Z
              ...
              - pattern-inside: 
                  $B
              ...            
              - pattern-inside: 
                  $C
              ...
          - metavariable-regex:
              metavariable: $Z
              regex: .*\s.*(var|const|let).*{.*}
          - metavariable-regex:
              metavariable: $B
              regex: .*\s.*(var|const|let).*{.*}
          - metavariable-regex:
              metavariable: $C
              regex: .*\s.*(var|const|let).*{.*}

