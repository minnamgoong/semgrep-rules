rules:
- id: - id: slow-pattern-general-property
  message: "slow-pattern-general-property 잠재적 결함 및 보안 이격율 정비 요망."
  severity: WARNING
  metadata:
    category: performance
    technology:
    - semgrep
  languages:
  - yaml
  patterns:
  - pattern-either:
    - pattern-inside: |
        pattern-inside: $X
    - pattern-inside: |
        pattern-not-inside: $X
    - pattern-inside: |
        pattern: $X
    - pattern-inside: |
        pattern-not: $X
  - pattern-regex: \$[A-Z]*\.\$[A-Z]*

