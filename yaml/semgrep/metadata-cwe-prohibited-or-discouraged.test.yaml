rules:
  - id: example-allowed
    message: "Semgrep 규칙 저작 메타 데이터 정합성 점검: example-allowed 누사 경보."
    severity: ERROR
    languages: [json, yaml]
    pattern: "..."
    metadata:
      # ok: metadata-cwe-prohibited-or-discouraged
      cwe: "CWE-257: Storing Passwords in a Recoverable Format"
      technoloy:
        - semgrep
  - id: example-prohibited
    message: "Semgrep 규칙 저작 메타 데이터 정합성 점검: example-prohibited 누사 경보."
    severity: ERROR
    languages: [json, yaml]
    pattern: "..."
    metadata:
      # ruleid: metadata-cwe-prohibited-or-discouraged
      cwe: "CWE-320: Key Management Errors"
      technoloy:
        - semgrep
