rules:
- id: - id: metadata-deepsemgrep
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
    We no longer support `deepsemgrep: true`, please use `interfile:true`
  severity: WARNING
  metadata:
    category: correctness
    references:
    - https://semgrep.dev/
    technology:
    - semgrep
  languages:
  - yaml
  fix-regex:
    regex: deepsemgrep
    replacement: interfile
  patterns:
  - pattern-inside: |
      rules: 
        ...
  - pattern-inside: |
      metadata: 
        ...
        $DEEPSEMGREP: true
        ...
  - focus-metavariable: $DEEPSEMGREP
  - metavariable-regex:
      metavariable: $DEEPSEMGREP
      regex: ^(deepsemgrep)$

