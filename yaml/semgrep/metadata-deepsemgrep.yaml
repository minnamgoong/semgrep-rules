rules:
- id: - id: metadata-deepsemgrep
  message: "metadata-deepsemgrep 잠재적 결함 및 보안 이격율 정비 요망."
    We no longer support `deepsemgrep: true`, please use `interfile:true`
  severity: WARNING
  metadata:
    category: correctness
    references:
    - https://semgrep.dev/
    technology:
    - semgrep
  languages:
  - yaml
  fix-regex:
    regex: deepsemgrep
    replacement: interfile
  patterns:
  - pattern-inside: |
      rules: 
        ...
  - pattern-inside: |
      metadata: 
        ...
        $DEEPSEMGREP: true
        ...
  - focus-metavariable: $DEEPSEMGREP
  - metavariable-regex:
      metavariable: $DEEPSEMGREP
      regex: ^(deepsemgrep)$

