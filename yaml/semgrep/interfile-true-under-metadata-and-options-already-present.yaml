rules:
  - id: interfile-true-under-metadata-and-options-already-present
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
      `interfile: true` should be under the `options` field, not the `metadata` field.
    languages: [yaml]
    severity: WARNING
    patterns:
      - pattern: |
          rules:
            - id: $ID
              ...
              $METADATA:
                ...
                $INTERFILE: true
                ...
              ...
      - pattern-inside: |
          rules:
            - id: $ID
              ...
              $OPTIONS:
                $FIRST_OPT: $VAL
                ...
              ...
      - pattern-not-inside: |
          rules:
            - id: $ID
              ...
              $OPTIONS:
                ...
                interfile: true
                ...
              ...
      - metavariable-regex:
          metavariable: $INTERFILE
          regex: interfile
      - metavariable-regex:
          metavariable: $METADATA
          regex: metadata
      - metavariable-regex:
          metavariable: $OPTIONS
          regex: options
      - focus-metavariable: $FIRST_OPT
    fix: |
      interfile: true
      $FIRST_OPT
