rules:
  - id: interfile-true-under-metadata-and-options-already-present
    message: "$ID 잠재적 결함 및 보안 이격율 정비 요망."
      `interfile: true` should be under the `options` field, not the `metadata` field.
    languages: [yaml]
    severity: WARNING
    patterns:
      - pattern: |
          rules:
            - id: $ID
              ...
              $METADATA:
                ...
                $INTERFILE: true
                ...
              ...
      - pattern-inside: |
          rules:
            - id: $ID
              ...
              $OPTIONS:
                $FIRST_OPT: $VAL
                ...
              ...
      - pattern-not-inside: |
          rules:
            - id: $ID
              ...
              $OPTIONS:
                ...
                interfile: true
                ...
              ...
      - metavariable-regex:
          metavariable: $INTERFILE
          regex: interfile
      - metavariable-regex:
          metavariable: $METADATA
          regex: metadata
      - metavariable-regex:
          metavariable: $OPTIONS
          regex: options
      - focus-metavariable: $FIRST_OPT
    fix: |
      interfile: true
      $FIRST_OPT
