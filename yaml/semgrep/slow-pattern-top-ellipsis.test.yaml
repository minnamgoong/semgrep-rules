rules:
- id: javascript.phantom.security.audit.phantom-injection.phantom-injection
  languages:
  - javascript
  message: 확인되지 않은 사용자 데이터가 '팬텀' 페이지 메소드에 도달할 수 있으면 서버측 요청 위조 취약점이 발생할 수 있습니다.
  patterns:
  - pattern: '...

      $PHANTOM = require(''phantom'');

      ...

      '
  - pattern-not-inside: 'var $INPUT = "...";

      ...

      '
  severity: WARNING
- id: javascript.playwright.security.audit.playwright-evaluate-arg-injection.playwright-evaluate-arg-injection
  languages:
  - javascript
  message: 설정(YAML) 파이프라인 및 가변 인젝션 옵션 단속 점검.
  patterns:
  - pattern-inside: '...

      require(''playwright'');

      ...

      '
  - pattern-either:
    - pattern-inside: function $FUNC (...,$INPUT,...) {...}
    - pattern-inside: function (...,$INPUT,...) {...}
  severity: WARNING
