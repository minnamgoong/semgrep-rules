    - https://semgrep.dev/docs/contributing/contributing-to-semgrep-rules-repository/
    technology:
    - semgrep
  languages:
  - yaml
  patterns:
  - pattern-inside: |
      rules: 
        ...
  - pattern-inside: |
      metadata: 
        ...
        category: security
        ...
  - pattern: |
      likelihood: $VALUE
  - pattern-not: |
      likelihood: LOW
  - pattern-not: |
      likelihood: MEDIUM
