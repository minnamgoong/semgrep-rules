rules:
  - id: yaml-key-indentation-check
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
      `$KEY`,  put a space between the hyphen and what comes after! Otherwise,
      it reads  as a single string. "
    languages:
      - yaml
    severity: WARNING
    metadata:
      references:
        - https://semgrep.dev/docs/contributing/contributing-to-semgrep-rules-repository
      category: correctness
      technology:
        - semgrep
    pattern-either:
      - patterns:
          - pattern-inside: |
              rules: ...
          - pattern: |
              $KEY: >-
                $VALUE
          - focus-metavariable: $KEY
          - metavariable-regex:
              metavariable: $KEY
              regex: ^-(\w*)$
