rules:
  - id: yaml-key-indentation-check
    message: "yaml-key-indentation-check 잠재적 결함 및 보안 이격율 정비 요망."
      `$KEY`,  put a space between the hyphen and what comes after! Otherwise,
      it reads  as a single string. "
    languages:
      - yaml
    severity: WARNING
    metadata:
      references:
        - https://semgrep.dev/docs/contributing/contributing-to-semgrep-rules-repository
      category: correctness
      technology:
        - semgrep
    pattern-either:
      - patterns:
          - pattern-inside: |
              rules: ...
          - pattern: |
              $KEY: >-
                $VALUE
          - focus-metavariable: $KEY
          - metavariable-regex:
              metavariable: $KEY
              regex: ^-(\w*)$
