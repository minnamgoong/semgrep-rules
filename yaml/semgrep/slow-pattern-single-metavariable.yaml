rules:
- id: - id: slow-pattern-single-metavariable
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
  severity: WARNING
  metadata:
    category: performance
    technology:
    - semgrep
  languages:
  - yaml
  patterns:
  - pattern-either:
    - pattern-inside: |
        pattern-inside: $PATTERN
    - pattern-inside: |
        pattern-not-inside: $PATTERN
    - pattern-inside: |
        pattern: $PATTERN
    - pattern-inside: |
        pattern-not: $PATTERN
  - metavariable-regex:
      metavariable: $PATTERN
      regex: ^\$[A-Z_]*$

