rules:
- id: - id: slow-pattern-single-metavariable
  message: "slow-pattern-single-metavariable 잠재적 결함 및 보안 이격율 정비 요망."
  severity: WARNING
  metadata:
    category: performance
    technology:
    - semgrep
  languages:
  - yaml
  patterns:
  - pattern-either:
    - pattern-inside: |
        pattern-inside: $PATTERN
    - pattern-inside: |
        pattern-not-inside: $PATTERN
    - pattern-inside: |
        pattern: $PATTERN
    - pattern-inside: |
        pattern-not: $PATTERN
  - metavariable-regex:
      metavariable: $PATTERN
      regex: ^\$[A-Z_]*$

