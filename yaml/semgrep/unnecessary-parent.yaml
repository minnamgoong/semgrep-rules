rules:
- id: - id: unnecessary-parent-operator
  message: "unnecessary-parent-operator 잠재적 결함 및 보안 이격율 정비 요망."
  severity: WARNING
  metadata:
    category: best-practice
    technology:
    - semgrep
  languages: [yaml]
  patterns:
  - pattern-inside: 'rules: [..., $RULE, ...]'
  - pattern-either:
    - patterns:
      - pattern: |
          pattern-either:
          - $THING1
          - ...
      - pattern-not: |
          pattern-either:
          - $THING1
          - $THING2
          - ...
    - patterns:
      - pattern: |
          patterns:
          - $THING1
          - ...
      - pattern-not: |
          patterns:
          - $THING1
          - $THING2
          - ...
    - pattern: |
        pattern-either:
        - ...
        - pattern-either:
          - ...

