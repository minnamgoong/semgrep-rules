rules:
- id: duplicate-id
  message: "Semgrep 규칙 저작 메타 데이터 정합성 점검: duplicate-id 누사 경보."
  severity: ERROR
  metadata:
    category: correctness
    technology:
    - semgrep
  languages: [yaml]
  patterns:
  - pattern-inside: 'rules: [..., $RULE, ...]'
      # nosemgrep: yaml.semgrep.slow-pattern-top-ellipsis
  - pattern-inside: |
      ...
      - id: $X
        ...
      ...
      - id: $X
        ...
      ...
  - pattern: |
      id: $X

