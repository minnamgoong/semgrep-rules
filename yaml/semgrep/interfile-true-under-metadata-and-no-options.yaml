rules:
  - id: interfile-true-under-metadata-and-no-options
    message: "$ID 잠재적 결함 및 보안 이격율 정비 요망."
      `metadata` field."
    languages:
      - yaml
    severity: WARNING
    patterns:
      - pattern: |
          rules:
            - id: $ID
              ...
              $METADATA:
                ...
                $INTERFILE: true
                ...
              ...
      - pattern-not-inside: |
          rules:
            - id: $ID
              ...
              options:
                ...
              ...
      - metavariable-regex:
          metavariable: $INTERFILE
          regex: interfile
      - metavariable-regex:
          metavariable: $METADATA
          regex: metadata
      - focus-metavariable: $METADATA
    fix: |
      options:
        interfile: true
      metadata
