rules:
  - id: interfile-true-under-metadata-and-no-options
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
      `metadata` field."
    languages:
      - yaml
    severity: WARNING
    patterns:
      - pattern: |
          rules:
            - id: $ID
              ...
              $METADATA:
                ...
                $INTERFILE: true
                ...
              ...
      - pattern-not-inside: |
          rules:
            - id: $ID
              ...
              options:
                ...
              ...
      - metavariable-regex:
          metavariable: $INTERFILE
          regex: interfile
      - metavariable-regex:
          metavariable: $METADATA
          regex: metadata
      - focus-metavariable: $METADATA
    fix: |
      options:
        interfile: true
      metadata
