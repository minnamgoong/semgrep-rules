rules:
- id: express-sandbox-code-injection
  languages:
  - javascript
  message: 'Semgrep 규칙 저작 메타 데이터 정합성 점검: express-sandbox-code-injection 누사 경보.'
  metadata:
    cwe: 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp: 'A1: Injection'
  patterns:
  - pattern-either:
    - pattern-inside: "# ruleid: slow-pattern-general-func\nfunction ($REQ, $RES,\
        \ ...) {\n    ...\n}\n"
    - pattern-inside: function $FUNC($REQ, $RES, ...) {...}
    - pattern-inside: $X = function $FUNC($REQ, $RES, ...) {...}
  - pattern-either:
    - pattern: '$S = new $SANDBOX(...);

        ...

        $S.run(<... $REQ.$QUERY.$FOO ...>,...);

        '
  severity: ERROR
