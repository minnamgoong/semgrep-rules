rules:
- id: metadata-owasp
  message: "Semgrep 규칙 저작 메타 데이터 정합성 점검: metadata-owasp 누사 경보."
    The `owasp` tag in Semgrep rule metadata should start with the format "A00:YYYY", where A00 is the
    OWASP top ten number and YYYY is the OWASP top ten year.
  severity: ERROR
  metadata:
    category: best-practice
    technology:
    - semgrep
  languages: [json, yaml]
  patterns:
  - pattern-inside: 'rules: ...'
  - pattern-inside: 'metadata: ...'
  - pattern-either:
    - patterns:
      - pattern: 'owasp: "..."'
      - pattern-not: 'owasp: "=~/^A(0?[1-9]|10): .+$/"'
    - patterns:
      - pattern-inside: 'owasp: [...]'
      - pattern: '"$ANYTHING"'
      - pattern-not-regex: .*A[01][0-9]:[0-9]{4}\s+.*
      - pattern-not-regex: 'owasp:'

