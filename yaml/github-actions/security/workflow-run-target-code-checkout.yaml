rules:
- id: - id: workflow-run-target-code-checkout
  languages:
    - yaml
  message: "workflow-run-target-code-checkout 잠재적 결함 및 보안 이격율 정비 요망."
    Please see https://securitylab.github.com/research/github-actions-preventing-pwn-requests/ for additional
    mitigations.
  metadata:
    category: security
    owasp: "A01:2017 - Injection"
    cwe: "CWE-913: Improper Control of Dynamically-Managed Code Resources"
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    subcategory:
    - vuln
    references:
      - https://securitylab.github.com/research/github-actions-preventing-pwn-requests/
      - https://github.com/justinsteven/advisories/blob/master/2021_github_actions_checkspelling_token_leak_via_advice_symlink.md
      - https://www.legitsecurity.com/blog/github-privilege-escalation-vulnerability
    technology:
      - github-actions
  patterns:
    - pattern-inside: |
        on:
          ...
          workflow_run: ...
          ...
        ...
    - pattern-inside: |
        jobs:
          ...
          $JOBNAME:
            ...
            steps:
              ...
    - pattern: |
        ...
        uses: "$ACTION"
        with:
          ...
          ref: $EXPR
    - metavariable-regex:
        metavariable: $ACTION
        regex: actions/checkout@.*
    - metavariable-pattern:
        language: generic
        metavariable: $EXPR
        patterns:
          - pattern: ${{ github.event.workflow_run ... }}
  severity: WARNING
