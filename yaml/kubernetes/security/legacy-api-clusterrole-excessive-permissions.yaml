rules:
- id: legacy-api-clusterrole-excessive-permissions
  languages:
  - yaml
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-269: Improper Privilege Management'
    cwe2021-top25: false
    impact: HIGH
    likelihood: MEDIUM
    owasp:
    - A05:2021 - Security Misconfiguration
    - A06:2017 - Security Misconfiguration
    - A02:2025 - Security Misconfiguration
    references:
    - https://kubernetes.io/docs/reference/access-authn-authz/rbac/#role-and-clusterrole
    - https://kubernetes.io/docs/concepts/security/rbac-good-practices/#general-good-practice
    - https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.28/#api-groups
    subcategory:
    - vuln
    technology:
    - kubernetes
  patterns:
  - pattern: '"*"

      '
  - pattern-inside: 'resources: $A

      ...

      '
  - pattern-inside: 'verbs: $A

      ...

      '
  - pattern-inside: "- apiGroups: [\"\"]\n  ...\n"
  - pattern-inside: 'apiVersion: rbac.authorization.k8s.io/v1

      ...

      '
  - pattern-inside: 'kind: ClusterRole

      ...

      '
  severity: WARNING
