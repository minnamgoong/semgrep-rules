rules:
- id: api-key-in-query-parameter
  languages:
  - yaml
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: LOW
    cwe: 'CWE-598: Use of GET Request Method With Sensitive Query Strings'
    impact: HIGH
    likelihood: MEDIUM
    owasp:
    - A04:2021 Insecure Design
    - A07:2021 Identification and Authentication Failures
    references:
    - https://datatracker.ietf.org/doc/html/rfc6749
    - https://cwe.mitre.org/data/definitions/598.html
    - https://owasp.org/Top10/A04_2021-Insecure_Design/
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
    subcategory:
    - vuln
    technology:
    - openapi
  patterns:
  - pattern-inside: "openapi: $VERSION\n...\ncomponents:\n  ...\n  securitySchemes:\n\
      \    ...\n"
  - metavariable-regex:
      metavariable: $VERSION
      regex: 3.*
  - pattern: "$SECURITY_SCHEME:\n  ...\n  type: apiKey\n  ...\n  in: query\n  \n"
  severity: WARNING
