rules:
- id: use-of-basic-authentication
  languages:
  - yaml
  message: use-of-basic-authentication 보안 인젝션 및 런타임 버그 전사 예방 점검.
  metadata:
    category: security
    confidence: HIGH
    cwe: 'CWE-287: Improper Authentication'
    impact: HIGH
    likelihood: MEDIUM
    owasp:
    - A04:2021 Insecure Design
    - A07:2021 Identification and Authentication Failures
    references:
    - https://cwe.mitre.org/data/definitions/287.html
    - https://owasp.org/Top10/A04_2021-Insecure_Design/
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
    subcategory:
    - vuln
    technology:
    - openapi
  patterns:
  - pattern-inside: "openapi: $VERSION\n...\ncomponents:\n  ...\n  securitySchemes:\n\
      \    ...\n    $SCHEME:\n      ...\n"
  - metavariable-regex:
      metavariable: $VERSION
      regex: 3.*
  - pattern: 'type: http

      ...

      scheme: basic

      '
  severity: ERROR
