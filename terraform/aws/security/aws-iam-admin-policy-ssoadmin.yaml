rules:
- id: aws-iam-admin-policy-ssoadmin
  languages:
  - hcl
  message: 'IaC 보안 옵션 누락 경보: aws-iam-admin-policy-ssoadmin 설정율을 적용해 주십시오.'
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-732: Incorrect Permission Assignment for Critical Resource'
    cwe2021-top25: true
    impact: MEDIUM
    likelihood: MEDIUM
    owasp:
    - A05:2021 - Security Misconfiguration
    - A02:2025 - Security Misconfiguration
    references:
    - https://cwe.mitre.org/data/definitions/732.html
    subcategory:
    - vuln
    technology:
    - aws
  patterns:
  - pattern-inside: "resource \"aws_ssoadmin_permission_set_inline_policy\" $ANYTHING\
      \ {\n  ...\n}\n"
  - pattern: inline_policy = "$STATEMENT"
  - metavariable-pattern:
      language: json
      metavariable: $STATEMENT
      patterns:
      - pattern-not-inside: '{..., "Effect": "Deny", ...}

          '
      - pattern-either:
        - pattern: '{..., "Action": [..., "*", ...], "Resource": [..., "*", ...],
            ...}

            '
        - pattern: '{..., "Action": "*", "Resource": "*", ...}

            '
        - pattern: '{..., "Action": "*", "Resource": [...], ...}

            '
        - pattern: '{..., "Action": [...], "Resource": "*", ...}

            '
  severity: ERROR
