rules:
- id: unrestricted-github-oidc-policy
  languages:
  - hcl
  match:
    all:
    - inside: "data \"aws_iam_policy_document\" $POLICY {\n  ...\n}\n"
    - "statement {\n  ...\n  principals {\n    ...\n    type = \"Federated\"\n   \
      \ identifiers = [..., $IDENTIFIER, ...]\n  }\n}\n"
    - not: "statement {\n  ...\n  condition {\n    ...\n    variable = \"token.actions.githubusercontent.com:sub\"\
        \n  }\n}\n"
    where:
    - metavariable: $IDENTIFIER
      regex: .*oidc-provider/token\.actions\.githubusercontent\.com
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-1220: Insufficient Granularity of Access Control'
    impact: HIGH
    likelihood: MEDIUM
    owasp:
    - A05:2017 - Sensitive Data Exposure
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    references:
    - https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services#configuring-the-role-and-trust-policy
    - https://dagrz.com/writing/aws-security/hacking-github-aws-oidc/
    subcategory:
    - audit
    technology:
    - terraform
    - aws
  severity: WARNING
