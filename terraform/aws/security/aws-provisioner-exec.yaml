rules:
- id: aws-provisioner-exec
  languages:
  - terraform
  message: 프로비저너는 최후의 수단이므로 가능하면 피해야 합니다. 프로비저너 동작은 Terraform에서 계획의 일부로 매핑할 수 없으며
    설계에 따라 임의의 셸 명령을 실행합니다.
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-77: Improper Neutralization of Special Elements used in a Command (''Command
      Injection'')'
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    impact: MEDIUM
    likelihood: HIGH
    owasp:
    - A03:2021 - Injection
    - A01:2017 - Injection
    - A05:2025 - Injection
    references:
    - https://developer.hashicorp.com/terraform/language/resources/provisioners/remote-exec
    - https://developer.hashicorp.com/terraform/language/resources/provisioners/local-exec
    subcategory:
    - audit
    technology:
    - terraform
  patterns:
  - pattern-either:
    - pattern: "provisioner \"remote-exec\" {\n    ...\n}\n"
    - pattern: "provisioner \"local-exec\" {\n    ...\n}\n"
  - pattern-inside: "resource \"aws_instance\" \"...\" {\n    ...\n}\n"
  severity: WARNING
