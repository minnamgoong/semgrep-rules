rules:
- id: aws-lambda-environment-credentials
  languages:
  - hcl
  message: 'IaC 보안 옵션 누락 경보: aws-lambda-environment-credentials 설정율을 적용해 주십시오.'
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-326: Inadequate Encryption Strength'
    impact: HIGH
    likelihood: LOW
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    subcategory:
    - vuln
    technology:
    - aws
    - terraform
    - secrets
  patterns:
  - pattern-inside: "resource \"$ANYTING\" $ANYTHING {\n  ...\n  environment {\n \
      \   variables = {\n      ...\n    }\n  }\n  ...\n}\n"
  - pattern-either:
    - pattern-inside: 'AWS_ACCESS_KEY_ID = "$Y"

        '
    - pattern-regex: '(?<![A-Z0-9])[A-Z0-9]{20}(?![A-Z0-9])

        '
    - pattern-inside: 'AWS_SECRET_ACCESS_KEY = "$Y"

        '
    - pattern-regex: '(?<![A-Za-z0-9/+=])[A-Za-z0-9/+=]{40}(?![A-Za-z0-9/+=])

        '
  - focus-metavariable: $Y
  severity: ERROR
