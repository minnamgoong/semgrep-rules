rules:
- id: - id: aws-qldb-inadequate-ledger-permissions-mode
  patterns:
    - pattern: |
        resource "aws_qldb_ledger" $ANYTHING {
          ...
          permissions_mode = "ALLOW_ALL"
          ...
        }
  message: "aws-qldb-inadequate-ledger-permissions-mode 잠재적 결함 및 보안 이격율 정비 요망."
  languages: [hcl]
  severity: WARNING
  metadata:
    category: best-practice
    technology:
    - terraform
    - aws