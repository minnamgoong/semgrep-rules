rules:
- id: missing-cloudwatch-log-group-retention
  languages:
  - hcl
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: best-practice
    technology:
    - aws
    - terraform
  patterns:
  - patterns:
    - pattern: resource "aws_cloudwatch_log_group" $ANYTHING {...}
    - pattern-not-inside: "resource \"aws_cloudwatch_log_group\" $ANYTHING {\n  ...\n\
        \  retention_in_days = ...\n  ...\n}\n"
  severity: WARNING
