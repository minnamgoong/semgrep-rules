rules:
- id: - id: missing-aws-cross-zone-lb
  patterns:
    - pattern-either:
      - pattern: |
          resource "aws_lb" $ANYTHING {
            ...
            load_balancer_type = ...
            ...
          }
      - pattern: |
          resource "aws_alb" $ANYTHING {
            ...
            load_balancer_type = ...
            ...
          }
    - pattern-not-inside: |
        resource $ANYLB $ANYTHING {
          ...
          enable_cross_zone_load_balancing = true
          ...
        }
    - pattern-not-inside: |
        resource $ANYLB $ANYTHING {
          ...
          load_balancer_type = "application"
          ...
        }
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
  languages: [hcl]
  severity: WARNING
  metadata:
    category: best-practice
    technology:
    - terraform
    - aws