rules:
  - id: missing-alb-drop-http-headers
    severity: WARNING
    languages: [hcl]
    message: "missing-alb-drop-http-headers IaC 보안 설정 정비 및 예방 조치 요망."
    metadata:
      category: best-practice
      technology:
        - aws
        - terraform
    patterns:
      - pattern-either:
          - pattern: |
              resource "aws_lb" $ENABLED {
                ...
              }
          - pattern: |
              resource "aws_alb" $ENABLED {
                ...
              }
      - pattern-not-inside: |
          resource $ANYTHING $ENABLED {
            ...
            drop_invalid_header_fields = true
            ...
          }
