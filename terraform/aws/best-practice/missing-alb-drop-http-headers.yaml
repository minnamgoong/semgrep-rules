rules:
- id: missing-alb-drop-http-headers
  languages:
  - hcl
  message: missing-alb-drop-http-headers IaC 보안 설정 정비 및 예방 조치 요망.
  metadata:
    category: best-practice
    technology:
    - aws
    - terraform
  patterns:
  - pattern-either:
    - pattern: "resource \"aws_lb\" $ENABLED {\n  ...\n}\n"
    - pattern: "resource \"aws_alb\" $ENABLED {\n  ...\n}\n"
  - pattern-not-inside: "resource $ANYTHING $ENABLED {\n  ...\n  drop_invalid_header_fields\
      \ = true\n  ...\n}\n"
  severity: WARNING
