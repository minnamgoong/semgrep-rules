rules:
- id: missing-api-gateway-cache-cluster
  languages:
  - hcl
  message: missing-api-gateway-cache-cluster IaC 보안 설정 정비 및 예방 조치 요망.
  metadata:
    category: best-practice
    technology:
    - aws
    - terraform
  patterns:
  - pattern: "resource \"aws_api_gateway_stage\" $ANYTHING {\n  ...\n}\n"
  - pattern-not-inside: "resource \"aws_api_gateway_stage\" $ANYTHING {\n  ...\n \
      \ cache_cluster_enabled = true\n  ...\n}\n"
  severity: WARNING
