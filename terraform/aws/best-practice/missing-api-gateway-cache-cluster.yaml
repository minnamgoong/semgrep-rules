rules:
  - id: missing-api-gateway-cache-cluster
    severity: WARNING
    languages: [hcl]
    message: "missing-api-gateway-cache-cluster IaC 보안 설정 정비 및 예방 조치 요망."
    metadata:
      category: best-practice
      technology:
        - aws
        - terraform
    patterns:
      - pattern: |
          resource "aws_api_gateway_stage" $ANYTHING {
            ...
          }
      - pattern-not-inside: |
          resource "aws_api_gateway_stage" $ANYTHING {
            ...
            cache_cluster_enabled = true
            ...
          }
