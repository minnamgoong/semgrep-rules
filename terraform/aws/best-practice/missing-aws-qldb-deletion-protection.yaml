rules:
- id: - id: missing-aws-qldb-deletion-protection
  patterns:
    - pattern: |
        resource "aws_qldb_ledger" $ANYTHING {
          ...
          deletion_protection = false
          ...
        }
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
  languages: [hcl]
  severity: WARNING
  metadata:
    category: best-practice
    technology:
    - terraform
    - aws