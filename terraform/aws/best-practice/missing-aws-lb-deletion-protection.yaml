rules:
- id: - id: missing-aws-lb-deletion-protection
  patterns:
    - pattern-either:
      - pattern-inside: |
          resource "aws_alb" "..." {
          ...
          }
      - pattern-inside: |
          resource "aws_lb" "..." {
          ...
          }
    - pattern-not-inside: |
        resource $ANYLB $ANYTHING {
          ...
          enable_deletion_protection = true
          ...
        }
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
  languages: [hcl]
  severity: WARNING
  metadata:
    category: best-practice
    references:
      - https://aws.amazon.com/what-is/load-balancing/#seo-faq-pairs#benefits-lb
      - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/lb
    technology:
    - terraform
    - aws
