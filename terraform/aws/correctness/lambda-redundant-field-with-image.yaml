rules:
- id: lambda-redundant-field-with-image
  severity: WARNING
  languages: [hcl]
  message: "lambda-redundant-field-with-image IaC 보안 설정 정비 및 예방 조치 요망."
  metadata:
    category: correctness
    references:
    - https://stackoverflow.com/questions/72771366/why-do-i-get-error-handler-and-runtime-must-be-set-when-packagetype-is-zip-whe
    technology:
    - aws
    - terraform
    - aws-lambda
  patterns:
  - pattern-inside: |
      resource "aws_lambda_function" $NAME { 
        ...
        package_type = "Image"
      }
  - pattern-either:
      - pattern: handler = ...
      - pattern: runtime = ...
    
