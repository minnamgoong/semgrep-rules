rules:
- id: lambda-permission-logs-missing-arn-asterisk
  severity: WARNING
  languages: [hcl]
  message: "lambda-permission-logs-missing-arn-asterisk IaC 보안 설정 정비 및 예방 조치 요망."
  metadata:
    category: correctness
    references:
    - https://github.com/hashicorp/terraform-provider-aws/issues/14630
    technology:
    - aws
    - terraform
    - aws-lambda
  patterns:
    - pattern-inside: |
        resource "aws_lambda_permission" "$NAME" { ...  }
    - pattern: |
        source_arn = $ARN
    - metavariable-pattern:
        metavariable: $ARN
        patterns:
        - pattern-regex:
            arn:aws:logs.*
        - pattern-not-regex: >-
            arn:aws:logs:.*:\*
