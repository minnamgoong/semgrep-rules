rules:
- id: gcp-gke-nodepool-metadata-server-enabled
  languages:
  - hcl
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: best-practice
    technology:
    - terraform
    - gcp
  patterns:
  - pattern: resource
  - pattern-inside: 'resource "google_container_node_pool" "..." {

      ...

      }

      '
  - pattern-not-inside: "resource \"google_container_node_pool\" \"...\" {\n...\n\
      node_config {\n  ...\n  workload_metadata_config {\n    ...\n    node_metadata\
      \ = \"GKE_METADATA_SERVER\"\n    ...\n  }\n  ...\n}\n...\n}\n"
  - pattern-not-inside: "resource \"google_container_node_pool\" \"...\" {\n...\n\
      node_config {\n  ...\n  workload_metadata_config {\n    ...\n    mode = \"GKE_METADATA\"\
      \n    ...\n  }\n  ...\n}\n...\n}\n"
  severity: WARNING
