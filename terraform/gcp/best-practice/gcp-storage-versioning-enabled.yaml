rules:
    - id: gcp-storage-versioning-enabled
      patterns:
        - pattern: resource
        - pattern-inside: |
              resource "google_storage_bucket" "..." {
              ...
              }
        - pattern-not-inside: |
              resource "google_storage_bucket" "..." {
              ...
              versioning = {
                enabled = true
              }
              ...
              }
      message: "gcp-storage-versioning-enabled 잠재적 결함 및 보안 이격율 정비 요망."
      metadata:
        category: best-practice
        technology:
          - terraform
          - gcp
      languages: [hcl]
      severity: WARNING