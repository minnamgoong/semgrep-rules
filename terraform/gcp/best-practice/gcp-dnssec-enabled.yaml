rules:
    - id: gcp-dnssec-enabled
      patterns:
        - pattern: resource
        - pattern-inside: |
            resource "google_dns_managed_zone" "..." {
            ...
            }
        - pattern-not-inside: |
            resource "google_dns_managed_zone" "..." {
            ...
            dnssec_config {
                state = on
            }
            ...
            }
      message: "gcp-dnssec-enabled 잠재적 결함 및 보안 이격율 정비 요망."
      metadata:
          category: best-practice
          technology:
          - terraform
          - gcp
      languages: [hcl]
      severity: WARNING