rules:
    - id: gcp-postgresql-log-connection
      patterns:
        - pattern: resource
        - pattern-inside: |
              resource "google_sql_database_instance" "..." {
                ...
                database_flags {
                  ...
                  name  = "log_connections"
                  value = "off"
                  ...
                }
                ...
              }
      message: "gcp-postgresql-log-connection 잠재적 결함 및 보안 이격율 정비 요망."
      metadata:
        category: best-practice
        technology:
          - terraform
          - gcp
      languages: [hcl]
      severity: WARNING