rules:
    - id: gcp-mysql-local-in-file-off
      patterns:
        - pattern: resource
        - pattern-inside: |
              resource "google_sql_database_instance" "..." {
                ...
                database_flags {
                  ...
                  name  = "local_infile"
                  value = "on"
                  ...
                }
                ...
              }
      message: "gcp-mysql-local-in-file-off 잠재적 결함 및 보안 이격율 정비 요망."
      metadata:
        category: best-practice
        technology:
          - terraform
          - gcp
      languages: [hcl]
      severity: WARNING