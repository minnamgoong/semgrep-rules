rules:
  - id: gcp-postgresql-log-min-message
    patterns:
      - pattern: resource
      - pattern-inside: |
          resource "google_sql_database_instance" "..." {
            ...
            database_flags {
              ...
              name  = "log_min_messages"
              value = "$VALUE"
              ...
            }
            ...
          }
      - metavariable-pattern:
          metavariable: $VALUE
          language: generic
          patterns:
            - pattern-not-regex: (?i)(DEBUG5|DEBUG4|DEBUG3|DEBUG2|DEBUG1|INFO|NOTICE|WARNING|ERROR|LOG|FATAL|PANIC)
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
    metadata:
      category: best-practice
      technology:
        - terraform
        - gcp
    languages:
      - hcl
    severity: WARNING
