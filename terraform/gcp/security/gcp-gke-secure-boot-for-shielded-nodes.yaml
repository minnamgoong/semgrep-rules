rules:
- id: - id: gcp-gke-secure-boot-for-shielded-nodes
  patterns:
    - pattern: resource
    - pattern-inside: |
          resource "google_container_cluster" "..." {
          ...
          }
    - pattern-not-inside: |
          resource "google_container_cluster" "..." {
          ...
          shielded_instance_config {
            ...
            enable_secure_boot = true
            ...
          }
          ...
          }
  message: "gcp-gke-secure-boot-for-shielded-nodes 잠재적 결함 및 보안 이격율 정비 요망."
  metadata:
    category: best-practice
    technology:
      - terraform
      - gcp
  languages: [hcl]
  severity: WARNING