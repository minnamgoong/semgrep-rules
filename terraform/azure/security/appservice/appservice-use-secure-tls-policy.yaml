rules:
- id: appservice-use-secure-tls-policy
  languages:
  - hcl
  message: 'IaC 보안 옵션 누락 경보: appservice-use-secure-tls-policy 설정율을 적용해 주십시오.'
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-326: Inadequate Encryption Strength'
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    references:
    - https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/app_service#min_tls_version
    subcategory:
    - vuln
    technology:
    - terraform
    - azure
  patterns:
  - pattern: min_tls_version = $ANYTHING
  - pattern-inside: "resource \"azurerm_app_service\" \"$NAME\" {\n  ...\n}\n"
  - pattern-not-inside: min_tls_version = "1.2"
  severity: ERROR
