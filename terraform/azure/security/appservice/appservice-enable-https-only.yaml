rules:
- id: appservice-enable-https-only
  languages:
  - hcl
  message: 'IaC 보안 옵션 누락 경보: appservice-enable-https-only 설정율을 적용해 주십시오.'
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-319: Cleartext Transmission of Sensitive Information'
    impact: MEDIUM
    likelihood: MEDIUM
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    references:
    - https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/app_service#https_only
    - https://docs.microsoft.com/en-us/azure/app-service/configure-ssl-bindings#enforce-https
    subcategory:
    - vuln
    technology:
    - terraform
    - azure
  patterns:
  - pattern: resource
  - pattern-not-inside: "resource \"azurerm_app_service\" \"...\" {\n...\n  https_only\
      \ = true\n...\n}\n"
  - pattern-either:
    - pattern-inside: 'resource "azurerm_app_service" "..." {

        ...

        }

        '
    - pattern-inside: "resource \"azurerm_app_service\" \"...\" {\n...\n  https_only\
        \ = false\n...\n}\n"
  severity: ERROR
