rules:
- id: appservice-authentication-enabled
  languages:
  - hcl
  message: 'IaC 보안 옵션 누락 경보: appservice-authentication-enabled 설정율을 적용해 주십시오.'
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-287: Improper Authentication'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: MEDIUM
    owasp:
    - A02:2017 - Broken Authentication
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/app_service#auth_settings
    subcategory:
    - vuln
    technology:
    - terraform
    - azure
  patterns:
  - pattern: resource
  - pattern-not-inside: "resource \"azurerm_app_service\" \"...\" {\n...\n  auth_settings\
      \ {\n    ...\n    enabled = true\n    ...\n  }\n...\n}\n"
  - pattern-either:
    - pattern-inside: 'resource "azurerm_app_service" "..." {

        ...

        }

        '
    - pattern-inside: "resource \"azurerm_app_service\" \"...\" {\n...\n  auth_settings\
        \ {\n    ...\n    enabled = false\n    ...\n  }\n...\n}\n"
  severity: ERROR
