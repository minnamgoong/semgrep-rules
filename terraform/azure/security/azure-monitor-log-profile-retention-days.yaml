rules:
- id: - id: azure-monitor-log-profile-retention-days
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
  patterns:
    - pattern: resource
    - pattern-either:
        - pattern-inside: |
            resource "azurerm_monitor_log_profile" "..." {
            ...
            retention_policy {
            ...
            enabled = true
            days = $DAYS
            ...
            }
            ...
            }
    - pattern-not-inside: |
        resource "azurerm_monitor_log_profile" "..." {
        ...
        retention_policy {
        ...
        enabled = false
        days = 0
        ...
        }
        ...
        }
    - metavariable-comparison:
        metavariable: $DAYS
        comparison: $DAYS < 365
  metadata:
    category: best-practice
    technology:
      - terraform
      - azure
  languages:
    - hcl
  severity: WARNING
