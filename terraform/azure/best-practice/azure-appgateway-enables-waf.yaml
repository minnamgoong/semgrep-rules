rules:
  - id: azure-appgateway-enables-waf
    message: "azure-appgateway-enables-waf 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_application_gateway" "..." {
          ...
          waf_configuration {
            enabled = true
          }
          ...
          }
      - pattern-inside: |
          resource "azurerm_application_gateway" "..." {
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
