rules:
  - id: azure-functionapps-accessible-over-https
    message: "azure-functionapps-accessible-over-https 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_app_service" "..." {
          ...
          https_only = true
          ...
          }
      - pattern-inside: |
          resource "azurerm_app_service" "..." {
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
