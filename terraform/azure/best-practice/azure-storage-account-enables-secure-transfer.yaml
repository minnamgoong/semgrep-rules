rules:
  - id: azure-storage-account-enables-secure-transfer
    message: "azure-storage-account-enables-secure-transfer 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-inside: |
          resource "azurerm_storage_account" "..." {
          ...
          enable_https_traffic_only = false
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
