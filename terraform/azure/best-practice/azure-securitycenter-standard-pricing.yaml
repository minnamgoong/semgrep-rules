rules:
  - id: azure-securitycenter-standard-pricing
    message: "azure-securitycenter-standard-pricing 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-inside: |
          resource "azurerm_security_center_subscription_pricing" "..." {
          ...
          }
      - pattern-not-inside: |
          resource "azurerm_security_center_subscription_pricing" "..." {
          ...
          tier = "Standard"
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
