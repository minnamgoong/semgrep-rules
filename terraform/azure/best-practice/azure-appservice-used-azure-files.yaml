rules:
- id: azure-appservice-used-azure-files
  languages:
  - hcl
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: best-practice
    technology:
    - terraform
    - azure
  patterns:
  - pattern: resource
  - pattern-not-inside: "resource \"azurerm_app_service\" \"...\" {\n...\nstorage_account\
      \ {\n  ...\n  type = \"AzureFiles\"\n  ...\n}\n...\n}\n"
  - pattern-inside: 'resource "azurerm_app_service" "..." {

      ...

      }

      '
  severity: INFO
