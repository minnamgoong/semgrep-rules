rules:
  - id: azure-keyvault-enables-soft-delete
    message: "azure-keyvault-enables-soft-delete 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-inside: |
          resource "azurerm_key_vault" "..." {
          ...
          soft_delete_enabled = false
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
