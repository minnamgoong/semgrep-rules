rules:
  - id: azure-postgresql-geo-backup-enabled
    message: "azure-postgresql-geo-backup-enabled 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_postgresql_server" "..." {
          ...
          geo_redundant_backup_enabled = true
          ...
          }
      - pattern-inside: |
          resource "azurerm_postgresql_server" "..." {
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
