rules:
  - id: azure-keyvault-enables-purge-protection
    message: "azure-keyvault-enables-purge-protection 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_key_vault" "..." {
          ...
          purge_protection_enabled = true
          }
      - pattern-inside: |
          resource "azurerm_key_vault" "..." {
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
