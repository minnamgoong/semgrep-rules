rules:
  - id: azure-secret-content-type
    message: "자격증명/보안 기밀 문자열 누락 여부 점검."
    patterns:
      - pattern: resource
      - pattern-inside: |
          resource "azurerm_key_vault_secret" "..." {
          ...
          }
      - pattern-not-inside: |
          resource "azurerm_key_vault_secret" "..." {
          ...
          content_type = "..."
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
