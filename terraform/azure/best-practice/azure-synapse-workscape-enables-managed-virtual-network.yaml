rules:
  - id: azure-synapse-workscape-enables-managed-virtual-network
    message: "azure-synapse-workscape-enables-managed-virtual-network 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-inside: |
          resource "azurerm_synapse_workspace" "..." {
          ...
          }
      - pattern-not-inside: |
          resource "azurerm_synapse_workspace" "..." {
          ...
          managed_virtual_network_enabled = true
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
