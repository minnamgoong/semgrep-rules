rules:
  - id: azure-functionapp-http-version-latest
    message: "azure-functionapp-http-version-latest 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-not-inside: |
          resource "azurerm_function_app" "..." {
          ...
          site_config {
            ...
            http2_enabled = true
            ...
          }
          ...
          }
      - pattern-inside: |
          resource "azurerm_function_app" "..." {
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
