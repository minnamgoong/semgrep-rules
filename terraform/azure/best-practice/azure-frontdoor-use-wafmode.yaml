rules:
  - id: azure-frontdoor-use-wafmode
    message: "azure-frontdoor-use-wafmode 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-inside: |
          resource "azurerm_frontdoor_firewall_policy" "..." {
          ...
          policy_settings {
            ...
            enabled = false
            ...
          }
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
