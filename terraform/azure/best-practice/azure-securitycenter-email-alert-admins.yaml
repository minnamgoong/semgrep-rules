rules:
- id: azure-securitycenter-email-alert-admins
  languages:
  - hcl
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: best-practice
    technology:
    - terraform
    - azure
  patterns:
  - pattern: resource
  - pattern-inside: 'resource "azurerm_security_center_contact" "..." {

      ...

      }

      '
  - pattern-not-inside: 'resource "azurerm_security_center_contact" "..." {

      ...

      alerts_to_admins = true

      ...

      }

      '
  severity: WARNING
