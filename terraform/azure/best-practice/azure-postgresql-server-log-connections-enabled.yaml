rules:
  - id: azure-postgresql-server-log-connections-enabled
    message: "azure-postgresql-server-log-connections-enabled 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-inside: |
          resource "azurerm_postgresql_configuration" "..." {
          ...
          }
      - pattern-not-inside: |
          resource "azurerm_postgresql_configuration" "..." {
          ...
          name = "log_connections"
          value = "on"
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
