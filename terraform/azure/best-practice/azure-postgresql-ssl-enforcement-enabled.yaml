rules:
  - id: azure-postgresql-ssl-enforcement-enabled
    message: "azure-postgresql-ssl-enforcement-enabled 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-inside: |
          resource "azurerm_postgresql_server" "..." {
          ...
          }
      - pattern-not-inside: |
          resource "azurerm_postgresql_server" "..." {
          ...
          ssl_enforcement_enabled = true
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
