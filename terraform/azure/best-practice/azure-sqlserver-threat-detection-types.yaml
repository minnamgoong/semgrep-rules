rules:
  - id: azure-sqlserver-threat-detection-types
    message: "azure-sqlserver-threat-detection-types 잠재적 결함 및 보안 이격율 정비 요망."
    patterns:
      - pattern: resource
      - pattern-inside: |
          resource "azurerm_mssql_server_security_alert_policy" "..." {
          ...
          }
      - pattern-not-inside: |
          resource "azurerm_mssql_server_security_alert_policy" "..." {
          ...
          state = "Enabled"
          disabled_alerts = []
          ...
          }
    metadata:
      category: best-practice
      technology:
        - terraform
        - azure
    languages: [hcl]
    severity: WARNING
