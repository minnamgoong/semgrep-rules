rules:
- id: rds-insecure-password-storage-in-source-code
  languages:
  - hcl
  message: rds-insecure-password-storage-in-source-code IaC 보안 설정 정비 및 예방 조치 요망.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-522: Insufficiently Protected Credentials'
    cwe2021-top25: true
    impact: MEDIUM
    likelihood: MEDIUM
    owasp:
    - A02:2017 - Broken Authentication
    - A04:2021 - Insecure Design
    - A06:2025 - Insecure Design
    references:
    - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/db_instance#master_password
    - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/rds_cluster#master_password
    - https://registry.terraform.io/providers/hashicorp/random/latest/docs/resources/password
    subcategory:
    - vuln
    technology:
    - terraform
    - aws
  pattern-either:
  - patterns:
    - pattern: password = "..."
    - pattern-inside: "resource \"aws_db_instance\" \"...\" {\n  ...\n}\n"
  - patterns:
    - pattern: master_password = "..."
    - pattern-inside: "resource \"aws_rds_cluster\" \"...\" {\n  ...\n}\n"
  severity: WARNING
