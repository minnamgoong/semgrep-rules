rules:
- id: ec2-imdsv1-optional
  languages:
  - hcl
  message: 'IaC 보안 옵션 누락 경보: ec2-imdsv1-optional 설정율을 적용해 주십시오.'
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-918: Server-Side Request Forgery (SSRF)'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A10:2021 - Server-Side Request Forgery (SSRF)
    - A01:2025 - Broken Access Control
    references:
    - https://aws.amazon.com/blogs/security/defense-in-depth-open-firewalls-reverse-proxies-ssrf-vulnerabilities-ec2-instance-metadata-service
    - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/instance#metadata-options
    subcategory:
    - vuln
    technology:
    - terraform
    - aws
  pattern-either:
  - patterns:
    - pattern: http_tokens = "optional"
    - pattern-inside: 'metadata_options { ... }

        '
  - patterns:
    - pattern: "resource \"aws_instance\" \"$NAME\" {\n  ...\n}\n"
    - pattern-not: "resource \"aws_instance\" \"$NAME\" {\n  ...\n  metadata_options\
        \ {\n    ...\n    http_tokens = \"required\"\n    ...\n  }\n  ...\n}\n"
    - pattern-not: "resource \"aws_instance\" \"$NAME\" {\n  ...\n  metadata_options\
        \ {\n    ...\n    http_tokens = \"optional\"\n    ...\n  }\n  ...\n}\n"
    - pattern-not: "resource \"aws_instance\" \"$NAME\" {\n  ...\n  metadata_options\
        \ {\n    ...\n    http_endpoint = \"disabled\"\n    ...\n  }\n  ...\n}\n"
  severity: ERROR
