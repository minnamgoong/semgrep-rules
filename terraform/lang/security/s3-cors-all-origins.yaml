rules:
- id: all-origins-allowed
  languages:
  - hcl
  message: all-origins-allowed IaC 보안 설정 정비 및 예방 조치 요망.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-942: Permissive Cross-domain Policy with Untrusted Domains'
    impact: LOW
    likelihood: LOW
    owasp:
    - A05:2021 - Security Misconfiguration
    - A02:2025 - Security Misconfiguration
    references:
    - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/s3_bucket#using-cors
    subcategory:
    - audit
    technology:
    - terraform
    - aws
  patterns:
  - pattern-inside: cors_rule { ... }
  - pattern: allowed_origins = ["*"]
  severity: WARNING
