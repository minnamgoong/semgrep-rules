rules:
- id: s3-public-read-bucket
  languages:
  - hcl
  message: S3 버킷 퍼블릭 오픈 및 암호화 누락 경보.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
    cwe2021-top25: true
    impact: LOW
    likelihood: LOW
    owasp:
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    references:
    - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/s3_bucket#acl
    - https://docs.aws.amazon.com/AmazonS3/latest/dev/acl-overview.html#canned-acl
    subcategory:
    - audit
    technology:
    - terraform
    - aws
  patterns:
  - pattern-either:
    - pattern: acl = "public-read"
    - pattern: acl = "authenticated-read"
  - pattern-not-inside: "resource \"aws_s3_bucket\" \"...\" {\n  ...\n  website {\
      \ ... }\n  ...\n}\n"
  severity: WARNING
