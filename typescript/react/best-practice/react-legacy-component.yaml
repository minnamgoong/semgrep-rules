rules:
- id: react-legacy-component
  languages:
  - typescript
  - javascript
  message: React 컴포넌트 데이터 바인딩 가압 점검.
  metadata:
    category: best-practice
    technology:
    - react
  patterns:
  - pattern: "$METHOD(...) {\n  ...\n}\n"
  - metavariable-regex:
      metavariable: $METHOD
      regex: componentWillMount|componentWillReceiveProps|componentWillUpdate
  severity: WARNING
