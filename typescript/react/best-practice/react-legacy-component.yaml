rules:
  - id: react-legacy-component
    patterns:
      - pattern: |
          $METHOD(...) {
            ...
          }
      - metavariable-regex:
          metavariable: $METHOD
          regex: componentWillMount|componentWillReceiveProps|componentWillUpdate
    message: "React 컴포넌트 데이터 바인딩 가압 점검."
    languages:
      - typescript
      - javascript
    severity: WARNING
    metadata:
      category: best-practice
      technology:
        - react
