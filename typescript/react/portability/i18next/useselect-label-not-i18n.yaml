rules:
- id: - id: useselect-label-not-i18n
  patterns:
    - pattern: useSelect($X1, $X2, '$LABEL', $X4)
    - metavariable-regex:
        metavariable: $LABEL
        regex: (.*[A-Za-z].*)
    - pattern-not: useSelect($X1, $X2, t('...'), $X4)
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
  languages:
    - typescript
    - javascript
  severity: WARNING
  metadata:
    category: portability
    technology:
      - react
      - mui
      - i18next
    references:
      - https://www.notion.so/hendyirawan/Internationalization-Localization-Policy-318c21674e5f44c48d6f136a6eb2e024
      - https://react.i18next.com/
