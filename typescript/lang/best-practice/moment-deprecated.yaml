rules:
- id: - id: moment-deprecated
  pattern: |
    import 'moment'
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
  languages:
  - typescript
  - javascript
  severity: INFO
  metadata:
    category: best-practice
    technology:
    - moment
    - dayjs
    references:
    - 'https://momentjs.com/docs/#/-project-status/'
    - 'https://day.js.org/'
