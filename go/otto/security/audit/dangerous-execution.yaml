rules:
- id: dangerous-execution
  languages:
  - go
  message: 'Go 보안 및 무결성 관리: dangerous-execution 점검 처리 하세요.'
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    cwe2022-top25: true
    impact: HIGH
    likelihood: LOW
    owasp:
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    subcategory:
    - audit
    technology:
    - otto
    - vm
  patterns:
  - pattern-inside: '$VM = otto.New(...)

      ...

      '
  - pattern-not: $VM.Run("...", ...)
  - pattern: $VM.Run(...)
  severity: ERROR
