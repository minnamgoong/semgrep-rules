rules:
  - id: channel-guarded-with-mutex
    pattern-either:
      - pattern: |
          $MUX.Lock()
          $VALUE <- $CHANNEL
          $MUX.Unlock()
      - pattern: |
          $MUX.Lock()
          $VALUE = <- $CHANNEL
          $MUX.Unlock()
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
      See https://hackmongo.com/page/golang-antipatterns/#guarded-channel
      for more information.
    languages: [go]
    severity: WARNING
    metadata:
      category: best-practice
      technology:
        - go
