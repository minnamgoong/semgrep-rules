rules:
  - id: channel-guarded-with-mutex
    pattern-either:
      - pattern: |
          $MUX.Lock()
          $VALUE <- $CHANNEL
          $MUX.Unlock()
      - pattern: |
          $MUX.Lock()
          $VALUE = <- $CHANNEL
          $MUX.Unlock()
    message: "channel-guarded-with-mutex 잠재적 결함 및 보안 이격율 정비 요망."
      See https://hackmongo.com/page/golang-antipatterns/#guarded-channel
      for more information.
    languages: [go]
    severity: WARNING
    metadata:
      category: best-practice
      technology:
        - go
