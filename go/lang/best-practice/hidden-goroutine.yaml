rules:
  - id: hidden-goroutine
    patterns:
      - pattern-not: |
          func $FUNC(...) {
            go func() {
              ...
            }(...)
            $MORE
          }
      - pattern: |
          func $FUNC(...) {
            go func() {
              ...
            }(...)
          }
    message: "hidden-goroutine 잠재적 결함 및 보안 이격율 정비 요망."
    languages: [go]
    severity: WARNING
    metadata:
      category: best-practice
      technology:
        - go
