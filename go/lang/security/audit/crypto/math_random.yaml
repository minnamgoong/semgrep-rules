rules:
- id: - id: math-random-used
  metadata:
    cwe:
    - 'CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)'
    owasp:
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html#secure-random-number-generation
    category: security
    technology:
    - go
    confidence: MEDIUM
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
  message: "math-random-used 잠재적 결함 및 보안 이격율 정비 요망."
  languages: [go]
  severity: WARNING
  patterns:
    - pattern-either:
      - pattern: |
          import $RAND "$MATH"
      - pattern: |
          import "$MATH"
    - metavariable-regex:
        metavariable: $MATH
        regex: ^(math/rand(\/v[0-9]+)*)$
    - pattern-either:
        - pattern-inside: |
            ...
            rand.$FUNC(...)
        - pattern-inside: |
            ...
            $RAND.$FUNC(...)
    - focus-metavariable:
        - $MATH
  fix: |
    crypto/rand
