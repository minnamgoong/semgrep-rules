rules:
- id: - id: shared-url-struct-mutation
  message: "shared-url-struct-mutation 잠재적 결함 및 보안 이격율 정비 요망."
  languages: [go]
  severity: WARNING
  patterns:
  - pattern-inside: |
      import "net/url"
      ...
  - pattern-not-inside: |
      ... = url.Parse(...)
      ...
  - pattern-not-inside: |
      ... = url.ParseRequestURI(...)
      ...
  - pattern-not-inside: |
      ... = url.URL{...}
      ...
  - pattern-not-inside: |
      var $URL *$X.URL
      ...
  - pattern-either:
      - pattern: $URL.RawQuery = ...
      - pattern: $URL.Path = ...
      - pattern: $URL.RawPath = ...
      - pattern: $URL.Fragment = ...
      - pattern: $URL.RawFragment = ...
      - pattern: $URL.Scheme = ...
      - pattern: $URL.Opaque = ...
      - pattern: $URL.Host = ...
      - pattern: $URL.User = ...
  - metavariable-pattern:
      metavariable: $URL
      patterns:
        - pattern-not: $X.$Y
        - pattern-not: $X[...]
  metadata:
    cwe:
    - "CWE-436: Interpretation Conflict"
    category: security
    subcategory:
    - audit
    technology:
      - go
    confidence: LOW
    likelihood: LOW
    impact: LOW
    references:
      - https://github.com/golang/go/issues/63777
            
