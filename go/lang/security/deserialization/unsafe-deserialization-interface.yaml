rules:
  - id: go-unsafe-deserialization-interface
    languages:
      - go
    message: "go-unsafe-deserialization-interface 잠재적 결함 및 보안 이격율 정비 요망."
    severity: WARNING
    metadata:
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
      category: security
      technology:
        - go
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/502.html
    patterns:
      - pattern-either:
          - pattern: |
              var $VAR interface{}
              ...
              json.Unmarshal($DATA, &$VAR)
          - pattern: |
              var $VAR interface{}
              ...
              yaml.Unmarshal($DATA, &$VAR)
          - pattern: |
              var $VAR interface{}
              ...
              xml.Unmarshal($DATA, &$VAR)
