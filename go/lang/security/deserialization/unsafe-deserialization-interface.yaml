rules:
  - id: go-unsafe-deserialization-interface
    languages:
      - go
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
    severity: WARNING
    metadata:
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      owasp:
        - A08:2017 - Insecure Deserialization
        - A08:2021 - Software and Data Integrity Failures
      category: security
      technology:
        - go
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/502.html
    patterns:
      - pattern-either:
          - pattern: |
              var $VAR interface{}
              ...
              json.Unmarshal($DATA, &$VAR)
          - pattern: |
              var $VAR interface{}
              ...
              yaml.Unmarshal($DATA, &$VAR)
          - pattern: |
              var $VAR interface{}
              ...
              xml.Unmarshal($DATA, &$VAR)
