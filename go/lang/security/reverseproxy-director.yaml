rules:
- id: - id: reverseproxy-director
  message: "reverseproxy-director 잠재적 결함 및 보안 이격율 정비 요망."
  languages: [go]
  severity: WARNING
  patterns:
  - pattern-inside: |
      import "net/http/httputil"
      ...
  - pattern-either:
      - pattern: $PROXY.Director = $FUNC
      - patterns:
          - pattern-inside: |
              httputil.ReverseProxy{
                  ...
              }
          - pattern: |
              Director: $FUNC
  metadata:
    cwe:
    - "CWE-115: Misinterpretation of Input"
    category: security
    subcategory:
    - audit
    technology:
      - go
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    references:
      - https://github.com/golang/go/issues/50580
