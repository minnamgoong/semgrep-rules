rules:
- id: - id: reverseproxy-director
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
  languages: [go]
  severity: WARNING
  patterns:
  - pattern-inside: |
      import "net/http/httputil"
      ...
  - pattern-either:
      - pattern: $PROXY.Director = $FUNC
      - patterns:
          - pattern-inside: |
              httputil.ReverseProxy{
                  ...
              }
          - pattern: |
              Director: $FUNC
  metadata:
    cwe:
    - "CWE-115: Misinterpretation of Input"
    category: security
    subcategory:
    - audit
    technology:
      - go
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    references:
      - https://github.com/golang/go/issues/50580
