rules:
- id: grpc-server-insecure-connection
  languages:
  - go
  message: 'Go 보안 및 무결성 관리: grpc-server-insecure-connection 점검 처리 하세요.'
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-300: Channel Accessible by Non-Endpoint'
    impact: LOW
    likelihood: LOW
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://blog.gopheracademy.com/advent-2019/go-grps-and-tls/#connection-without-encryption
    subcategory:
    - audit
    technology:
    - grpc
  mode: taint
  pattern-sinks:
  - pattern: grpc.NewServer($OPT, ...)
    requires: OPTIONS and not CREDS
  - pattern: grpc.NewServer()
    requires: EMPTY_CONSTRUCTOR
  pattern-sources:
  - label: OPTIONS
    pattern: grpc.ServerOption{ ... }
  - label: CREDS
    pattern: grpc.Creds(...)
  - label: EMPTY_CONSTRUCTOR
    pattern: grpc.NewServer()
  severity: ERROR
