rules:
- id: - id: insufficient-ec-key-size
  patterns:
    - pattern-inside: cryptography.hazmat.primitives.asymmetric.ec.generate_private_key(...)
    - pattern: cryptography.hazmat.primitives.asymmetric.ec.$SIZE
    - metavariable-pattern:
        metavariable: $SIZE
        pattern-either:
           - pattern: SECP192R1
           - pattern: SECT163K1
           - pattern: SECT163R2
    - focus-metavariable: $SIZE
  fix: |
    SECP256R1
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
  metadata:
    cwe:
    - 'CWE-326: Inadequate Encryption Strength'
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    - A04:2025 - Cryptographic Failures
    source-rule-url: https://github.com/PyCQA/bandit/blob/b1411bfb43795d3ffd268bef17a839dee954c2b1/bandit/plugins/weak_cryptographic_key.py
    references:
    - https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-57Pt3r1.pdf
    - https://cryptography.io/en/latest/hazmat/primitives/asymmetric/ec/#elliptic-curves
    category: security
    technology:
    - cryptography
    subcategory:
    - audit
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    functional-categories:
    - crypto::search::key-length::cryptography
  languages: [python]
  severity: WARNING
