rules:
- fix: 'True

    '
  id: unverified-jwt-decode
  languages:
  - python
  message: JWT 디코딩 시 verify=False 플래그가 발견되었습니다. 무결성 검증을 위해 누출 옵션을 활성화하십시오.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-287: Improper Authentication'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: MEDIUM
    owasp:
    - A02:2017 - Broken Authentication
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://github.com/we45/Vulnerable-Flask-App/blob/752ee16087c0bfb79073f68802d907569a1f0df7/app/app.py#L96
    subcategory:
    - audit
    technology:
    - jwt
  patterns:
  - pattern-either:
    - patterns:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": $BOOL, ...}, ...)

          '
      - metavariable-pattern:
          metavariable: $BOOL
          pattern: 'False

            '
      - focus-metavariable: $BOOL
    - patterns:
      - pattern: '$OPTS = {..., "verify_signature": $BOOL, ...}

          ...

          jwt.decode(..., options=$OPTS, ...)

          '
      - metavariable-pattern:
          metavariable: $BOOL
          pattern: 'False

            '
      - focus-metavariable: $BOOL
  severity: ERROR
