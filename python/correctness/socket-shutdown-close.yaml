rules:
- id: - id: socket-shutdown-close
  patterns:
    - pattern: |
        $SOCK.shutdown(socket.$A)
        $SOCK.close()
    - pattern-not-inside: |
        try:
            ...
        except ...:
            ...
            $SOCK.close()
    - pattern-not-inside: |
        try:
            ...
        finally:
            ...
            $SOCK.close()
  message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
  metadata:
    references:
    - https://www.paulsprogrammingnotes.com/2021/12/python-memory-leaks.html
    category: 'correctness'
    technology: 
      - python
  languages: [python]
  severity: WARNING
