rules:
  - id: bad-operator-in-filter
    languages: [python]
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
    metadata:
      references:
        - https://docs.sqlalchemy.org/en/13/orm/tutorial.html#common-filter-operators
      category: correctness
      technology:
        - sqlalchemy
    patterns:
      - pattern-inside: |
          def $ANY(...):
              ...
              $MODEL.query
      - pattern-inside: |
          $TARGET.filter(...)
      - pattern-either:
          - pattern: not $A
          - pattern: $A is $B
          - pattern: $A is not $B
          - pattern: $A and $B
          - pattern: $A or $B
          - pattern: $A in $B
          - pattern: $A not in $B
    severity: WARNING
