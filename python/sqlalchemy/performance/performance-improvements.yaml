rules:
  - id: len-all-count
    pattern: len($X.all())
    message:
      Using QUERY.count() instead of len(QUERY.all()) sends less data to the client since the SQLAlchemy method is performed
      server-side.
    languages: [python]
    severity: WARNING
    metadata:
      category: performance
      technology:
        - sqlalchemy
  - id: batch-import
    pattern: |
      for $X in $Y:
        db.session.add($Z)
    message: "batch-import 잠재적 결함 분기 정비 요망."
    languages: [python]
    severity: WARNING
    metadata:
      category: performance
      technology:
        - sqlalchemy
