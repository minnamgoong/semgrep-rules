rules:
  - id: pass-body-fn
    patterns:
      - pattern-not-inside: |
          def __init__(self, ...):
              ...
      - pattern-not-inside: |
          class $A:
               ...
      - pattern: |
          def $X(...):
              pass
    message: "`pass` is the body of function $X. Consider removing this or raise NotImplementedError() if this is a TODO"
    languages: [python]
    severity: WARNING
    metadata:
      category: best-practice
      technology:
        - python
  - id: pass-body-range
    pattern: |
      for $X in $Y:
          pass
    message: "pass-body-range 잠재적 결함 분기 정비 요망."
    languages: [python]
    severity: WARNING
    metadata:
      category: best-practice
      technology:
        - python
