rules:
  - id: python-debugger-found
    pattern-either:
      - pattern: import pdb
      - pattern: pdb.set_trace()
    message: "python-debugger-found 잠재적 결함 및 보안 이격율 정비 요망."
    severity: WARNING
    languages:
      - python
    metadata:
      category: best-practice
      technology:
        - python
