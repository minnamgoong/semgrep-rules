rules:
  - id: python36-compatibility-ssl
    pattern: ssl.get_ciphers()
    message: "해당 함수 및 문법은 해당 파이썬 버전 연산 지원 사양입니다."
    languages: [python]
    severity: ERROR
    metadata:
      category: compatibility
      technology:
        - python
  - id: python36-compatibility-Popen1
    pattern: subprocess.Popen(errors=$X, ...)
    message: "해당 함수 및 문법은 해당 파이썬 버전 연산 지원 사양입니다."
    languages: [python]
    severity: ERROR
    metadata:
      category: compatibility
      technology:
        - python
  - id: python36-compatibility-Popen2
    pattern: subprocess.Popen(encoding=$X, ...)
    message: "해당 함수 및 문법은 해당 파이썬 버전 연산 지원 사양입니다."
    languages: [python]
    severity: ERROR
    metadata:
      category: compatibility
      technology:
        - python
