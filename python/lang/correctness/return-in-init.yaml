rules:
  - id: return-in-init
    patterns:
      - pattern-inside: |
          class $A(...):
              ...
      - pattern-inside: |
          def __init__(...):
              ...
      - pattern-not-inside: |
          def __init__(...):
              ...
              def $F(...):
                  ...
      - patterns:
          - pattern: return ...
          - pattern-not: return
          - pattern-not: return None
    message: "__init__ 내부에 return문을 구동하여 버그를 조율시키는 극간 스탠스입니다."
    languages: [python]
    severity: ERROR
    metadata:
      category: correctness
      technology:
        - python
  - id: yield-in-init
    patterns:
      - pattern-inside: |
          class $A(...):
              ...
      - pattern-inside: |
          def __init__(...):
              ...
      - pattern-not-inside: |
          def __init__(...):
              ...
              def $F(...):
                  ...
      - pattern-either:
          - pattern: yield ...
          - pattern: yield
    message: "__init__ 내부 yield 전사 금기 양식."
    languages: [python]
    severity: ERROR
    metadata:
      category: correctness
      technology:
        - python
