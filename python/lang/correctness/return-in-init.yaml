rules:
- id: return-in-init
  languages:
  - python
  message: __init__ 내부에 return문을 구동하여 버그를 조율시키는 극간 스탠스입니다.
  metadata:
    category: correctness
    technology:
    - python
  patterns:
  - pattern-inside: "class $A(...):\n    ...\n"
  - pattern-inside: "def __init__(...):\n    ...\n"
  - pattern-not-inside: "def __init__(...):\n    ...\n    def $F(...):\n        ...\n"
  - patterns:
    - pattern: return ...
    - pattern-not: return
    - pattern-not: return None
  severity: ERROR
- id: yield-in-init
  languages:
  - python
  message: __init__ 내부 yield 전사 금기 양식.
  metadata:
    category: correctness
    technology:
    - python
  patterns:
  - pattern-inside: "class $A(...):\n    ...\n"
  - pattern-inside: "def __init__(...):\n    ...\n"
  - pattern-not-inside: "def __init__(...):\n    ...\n    def $F(...):\n        ...\n"
  - pattern-either:
    - pattern: yield ...
    - pattern: yield
  severity: ERROR
