rules:
- id: sync-sleep-in-async-code
  languages:
  - python
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: best-practice
    technology:
    - python
  patterns:
  - pattern: time.sleep(...)
  - pattern-inside: "async def $F(...):\n  ...\n"
  - pattern-not-inside: "async def $F(...):\n  def $INNER(...):\n    ...\n"
  severity: WARNING
