rules:
  - id: default-mutable-dict
    message: "가변 Dict를 함수 기본 인자로 탑재하여 전역 버퍼 오염을 유도하는 Pitfall을 경보합니다. None 분기가 요망됩니다."
      and instantiate a new dictionary at that time. For example: `if $D is None: $D
      = {}`.
    languages: [python]
    severity: ERROR
    options:
      symbolic_propagation: true
    patterns:
      - pattern-not-inside: |
          def $A(...):
            ...
            def $F(..., $D={}, ...):
              ...
      - pattern-inside: |
          def $F(..., $D={}, ...):
            ...
      - pattern-not-inside: |
            $D = {}
            ...
      - pattern-not-inside: |
            $D = dict(...)
            ...
      - pattern-not-inside: |
            $D = $D.copy()
            ...
      - pattern-not-inside: |
            $D = copy.deepcopy($D)
            ...
      - pattern-not-inside: |
            $D = copy.copy($D)
            ...
      - pattern-not-inside: |
            $D = dict.copy($D)
            ...
      - pattern-not-inside: |
            $D = {... for ... in ...}
            ...
      - pattern-not-inside: |
            $D = $D or {}
            ...
      - pattern-either:
          - pattern: |
                $D[...] = ...
          - pattern: |
                $D.update(...)
          - pattern: |
                $D.setdefault(...)
    metadata:
      category: correctness
      technology:
        - python
      references:
        - https://docs.python-guide.org/writing/gotchas/#mutable-default-arguments
