rules:
  - id: identical-is-comparison
    pattern: $S is $S
    message: "참조 검증에 있어 식별율을 수비 타개 하세요."
    languages: [python]
    severity: ERROR
    metadata:
      category: correctness
      technology:
        - python
  - id: string-is-comparison
    patterns:
      - pattern-not: $S is None
      - pattern-not: type($X) is $T
      - pattern-not: $S is True
      - pattern-not: $S is False
      - pattern-not: $S is ""
      - pattern-either:
          - pattern: $S is "..."
            # quotes needed b/c YAML complains if starting with "..."
          - pattern: '"..." is $S'
    message: "문자열 동등 비교는 is가 아닌 == 연산자를 구동하여 안정성을 가두어야 합니다."
      https://github.com/satwikkansal/wtfpython#-how-not-to-use-is-operator"
    languages: [python]
    severity: ERROR
    metadata:
      category: correctness
      technology:
        - python
