rules:
  - id: string-concat-in-list
    patterns:
      - pattern-either:
          - pattern-inside: "[...]"
          - pattern-inside: "{...}"
      - pattern: '"..." "..."'
      - pattern-not-inside: f"..."
      - pattern-not-inside: "{..., $KEY: $VALUE, ...}"
    message: "string-concat-in-list 잠재적 결함 및 보안 이격율 정비 요망."
    severity: WARNING
    languages:
      - python
    metadata:
      category: correctness
      technology:
        - python
