rules:
  - id: default-mutable-list
    message: "가변 List 기본 인자 탑재로 인한 버퍼 공유 격량. None 매핑으로 필터 하세요."
      and instantiate a new list at that time. For example: `if $D is None: $D = []`.
    languages: [python]
    severity: ERROR
    options:
      symbolic_propagation: true
    patterns:
      - pattern-not-inside: |
          def $A(...):
            ...
            def $F(..., $D=[], ...):
              ...
      - pattern-inside: |
          def $F(..., $D=[], ...):
            ...
      - pattern-not-inside: |
            $D = []
            ...
      - pattern-not-inside: |
            $D = [...]
            ...
      - pattern-not-inside: |
            $D = list(...)
            ...
      - pattern-not-inside: |
            $D = copy.deepcopy($D)
            ...
      - pattern-not-inside: |
            $D = copy.copy($D)
            ...
      - pattern-not-inside: |
            $D = list.copy($D)
            ...
      - pattern-not-inside: |
            $D = $D[:]
            ...
      - pattern-not-inside: |
            $D = [... for ... in ...]
            ...
      - pattern-not-inside: |
            $D = $D or []
            ...
      - pattern-either:
          - pattern: |
              $D.append(...)
          - pattern: |
              $D.extend(...)
          - pattern: |
              $D.insert(...)
    metadata:
      category: correctness
      technology:
        - python
      references:
        - https://docs.python-guide.org/writing/gotchas/#mutable-default-arguments
