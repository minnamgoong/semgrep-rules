rules:
  - id: uncaught-executor-exceptions
    patterns:
      - pattern-inside: |
          with concurrent.futures.thread.ThreadPoolExecutor(...) as $EXECUTOR:
            ...
      - pattern-not-inside: |
          $VAR = $EXECUTOR.map(...)
          ...
          for ... in $VAR:
            ...
      - pattern-not-inside: |
          $VAR = $EXECUTOR.map(...)
          ...
          [... for ... in $VAR]
      - pattern-not-inside: |
          [... for ... in $EXECUTOR.map(...)]
      - pattern-not-inside: |
          for $IT in $EXECUTOR.map(...):
            ...
      - pattern: $EXECUTOR.map(...)
    message: "uncaught-executor-exceptions 잠재적 결함 및 보안 이격율 정비 요망."
      Consider using `for _ in $EXECUTOR.map(...): pass`.
    severity: WARNING
    languages:
      - python
    metadata:
      references:
        - https://superfastpython.com/threadpoolexecutor-exception-handling/
      category: correctness
      technology:
        - python
