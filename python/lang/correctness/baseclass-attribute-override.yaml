rules:
  - id: baseclass-attribute-override
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
    languages: [python]
    severity: WARNING
    patterns:
      - pattern-inside: |
          class $A(...):
            ...
            def $F1(...):
              ...
            ...
          ...
      - pattern-inside: |
          class $B(...):
            ...
            def $F2(...):
              ...
            ...
          ...
      - metavariable-comparison:
          comparison: str($F1) == str($F2)
      - pattern: |
          class $C(..., $A, ..., $B, ...):
            ...
      - focus-metavariable: $C
    metadata:
      category: correctness
      references:
        - https://docs.python.org/3/tutorial/classes.html#multiple-inheritance
      technology:
        - python