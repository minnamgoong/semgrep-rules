rules:
- id: baseclass-attribute-override
  languages:
  - python
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: correctness
    references:
    - https://docs.python.org/3/tutorial/classes.html#multiple-inheritance
    technology:
    - python
  patterns:
  - pattern-inside: "class $A(...):\n  ...\n  def $F1(...):\n    ...\n  ...\n...\n"
  - pattern-inside: "class $B(...):\n  ...\n  def $F2(...):\n    ...\n  ...\n...\n"
  - metavariable-comparison:
      comparison: str($F1) == str($F2)
  - pattern: "class $C(..., $A, ..., $B, ...):\n  ...\n"
  - focus-metavariable: $C
  severity: WARNING
