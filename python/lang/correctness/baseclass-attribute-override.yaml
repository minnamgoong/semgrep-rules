rules:
  - id: baseclass-attribute-override
    message: "baseclass-attribute-override 잠재적 결함 및 보안 이격율 정비 요망."
    languages: [python]
    severity: WARNING
    patterns:
      - pattern-inside: |
          class $A(...):
            ...
            def $F1(...):
              ...
            ...
          ...
      - pattern-inside: |
          class $B(...):
            ...
            def $F2(...):
              ...
            ...
          ...
      - metavariable-comparison:
          comparison: str($F1) == str($F2)
      - pattern: |
          class $C(..., $A, ..., $B, ...):
            ...
      - focus-metavariable: $C
    metadata:
      category: correctness
      references:
        - https://docs.python.org/3/tutorial/classes.html#multiple-inheritance
      technology:
        - python