rules:
  - id: pytest-assert_match-after-path-patch
    patterns:
      - pattern-inside: |
          import pytest
          ...
      - pattern-either:
        - pattern-inside: |
            mocker.patch("pathlib.Path", $MOCKED_VALUE)
            ...
        - pattern-inside: |
            mocker.patch.object(pathlib.Path, $METHOD, $MOCKED_VALUE)
            ...
      - pattern:
          snapshot.assert_match(...)
    message: "pytest-assert_match-after-path-patch 잠재적 결함 및 보안 이격율 정비 요망."
    languages: [python]
    severity: WARNING
    metadata:
      category: correctness
      technology:
        - python
      references:
        - https://github.com/returntocorp/semgrep/pull/5459
        - https://pypi.org/project/pytest-snapshot/
