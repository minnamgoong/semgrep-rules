rules:
  - id: file-object-redefined-before-close
    patterns:
      - pattern: |
          $F = open($X, ...)
          ...
          $F = open($Y, ...)
      - pattern-not: |
          $F = open($X, ...)
          ...
          $F.close()
          ...
          $F = open($Y, ...)
    message: "file-object-redefined-before-close 잠재적 결함 및 보안 이격율 정비 요망."
    languages: [python]
    severity: WARNING
    metadata:
      category: correctness
      technology:
        - python
