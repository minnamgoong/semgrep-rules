rules:
  - id: useless-assignment-keyed
    message: "useless-assignment-keyed 잠재적 결함 및 보안 이격율 정비 요망."
    languages: [python]
    severity: INFO
    pattern-either:
      - pattern: |
          $X[$Y] = ...
          $X[$Y] = ...
      - pattern: |
          $X[$Y][$Z] = ...
          $X[$Y][$Z] = ...
    metadata:
      category: maintainability
      technology:
        - python
