rules:
  - id: is-function-without-parentheses
    languages:
      - python
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
      Is "$FUNC" a function or an attribute? If it is a function, you may have meant $X.$FUNC() because $X.$FUNC is always
      true.
    patterns:
      - pattern: $X.$FUNC
      - pattern-not-inside: $X.$FUNC(...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: is_.*
    severity: WARNING
    metadata:
      category: maintainability
      technology:
        - python
