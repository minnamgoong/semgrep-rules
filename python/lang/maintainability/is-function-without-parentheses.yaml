rules:
  - id: is-function-without-parentheses
    languages:
      - python
    message: "is-function-without-parentheses 잠재적 결함 및 보안 이격율 정비 요망."
      Is "$FUNC" a function or an attribute? If it is a function, you may have meant $X.$FUNC() because $X.$FUNC is always
      true.
    patterns:
      - pattern: $X.$FUNC
      - pattern-not-inside: $X.$FUNC(...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: is_.*
    severity: WARNING
    metadata:
      category: maintainability
      technology:
        - python
