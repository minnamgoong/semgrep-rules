rules:
  - id: useless-literal
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
    languages: [python]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: |
              {..., $X: $A, ..., $X: $B, ...}
          - pattern: |
              dict(..., ($X, $A), ..., ($X, $B), ...)
      - focus-metavariable: $X
    metadata:
      category: maintainability
      references:
        - https://docs.python.org/3/library/stdtypes.html#mapping-types-dict
      technology:
        - python
