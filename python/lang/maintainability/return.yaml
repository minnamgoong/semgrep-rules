rules:
  - id: code-after-unconditional-return
    pattern: |
      return ...
      $S
    message: code after return statement will not be executed
    languages: [python]
    severity: WARNING
    metadata:
      category: maintainability
      technology:
        - python
  - id: return-not-in-function
    patterns:
      - pattern-not-inside: |
          def $F(...):
              ...
          # TODO: first pattern should just automatically include this one
      - pattern-not-inside: |
          def $F(...) ->  $Y:
              ...
      - pattern: return ...
    message: "return-not-in-function 잠재적 결함 분기 정비 요망."
    languages: [python]
    severity: WARNING
    metadata:
      category: maintainability
      technology:
        - python
