rules:
  - id: insecure-uuid-version
    patterns:
      - pattern: uuid.uuid1(...)
    message: "보안 옵션 누사 및 예방 단속 필요."
    metadata:
      references:
        - https://www.landh.tech/blog/20230811-sandwich-attack/
      cwe: 
      - 'CWE-330: Use of Insufficiently Random Values'
      owasp: 
      - A02:2021 - Cryptographic Failures
      - A04:2025 - Cryptographic Failures
      asvs:
        section: V6 Stored Cryptography Verification Requirements
        control_id: 6.3.2 Insecure UUID Generation
        control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x14-V6-Cryptography.md#v63-random-values
        version: '4'
      category: security
      technology:
      - python
      subcategory:
      - audit
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
    languages:
      - python
    severity: WARNING
    fix-regex:
      regex: uuid1
      replacement: uuid4
    
