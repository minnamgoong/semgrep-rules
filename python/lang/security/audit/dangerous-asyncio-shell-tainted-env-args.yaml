rules:
- id: dangerous-asyncio-shell-tainted-env-args
  languages:
  - python
  message: 환경 변수 또는 외부 입력이 비동기 쉘 명령 실행에 직접 사용되고 있습니다. 커맨드 인젝션 취약점을 예방하려면 입력값을 엄격히
    검증하거나 쉘을 사용하지 않는 방식으로 전환하세요.
  metadata:
    asvs:
      control_id: 5.3.8 OS Command Injection
      control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x13-V5-Validation-Sanitization-Encoding.md#v53-output-encoding-and-injection-prevention-requirements
      section: 'V5: Validation, Sanitization and Encoding Verification Requirements'
      version: '4'
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS
      Command Injection'')'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: HIGH
    likelihood: MEDIUM
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://docs.python.org/3/library/asyncio-subprocess.html
    - https://docs.python.org/3/library/shlex.html
    - https://semgrep.dev/docs/cheat-sheets/python-command-injection/
    subcategory:
    - vuln
    technology:
    - python
  mode: taint
  options:
    symbolic_propagation: true
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern-inside: $LOOP.subprocess_shell($PROTOCOL, $CMD)
      - pattern-inside: asyncio.subprocess.create_subprocess_shell($CMD, ...)
      - pattern-inside: asyncio.create_subprocess_shell($CMD, ...)
    - focus-metavariable: $CMD
    - pattern-not-inside: '$CMD = "..."

        ...

        '
    - pattern-not: $LOOP.subprocess_shell($PROTOCOL, "...")
    - pattern-not: asyncio.subprocess.create_subprocess_shell("...", ...)
    - pattern-not: asyncio.create_subprocess_shell("...", ...)
  pattern-sources:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern-either:
          - pattern: os.environ
          - pattern: os.environ.get('$FOO', ...)
          - pattern: os.environb
          - pattern: os.environb.get('$FOO', ...)
          - pattern: os.getenv('$ANYTHING', ...)
          - pattern: os.getenvb('$ANYTHING', ...)
      - patterns:
        - pattern-either:
          - patterns:
            - pattern-either:
              - pattern: sys.argv
              - pattern: sys.orig_argv
          - patterns:
            - pattern-inside: '$PARSER = argparse.ArgumentParser(...)

                ...

                '
            - pattern-inside: '$ARGS = $PARSER.parse_args()

                '
            - pattern: <... $ARGS ...>
          - patterns:
            - pattern-inside: '$PARSER = optparse.OptionParser(...)

                ...

                '
            - pattern-inside: '$ARGS = $PARSER.parse_args()

                '
            - pattern: <... $ARGS ...>
          - patterns:
            - pattern-either:
              - pattern-inside: '$OPTS, $ARGS = getopt.getopt(...)

                  ...

                  '
              - pattern-inside: '$OPTS, $ARGS = getopt.gnu_getopt(...)

                  ...

                  '
            - pattern-either:
              - patterns:
                - pattern-inside: "for $O, $A in $OPTS:\n  ...\n"
                - pattern: $A
              - pattern: $ARGS
  severity: ERROR
