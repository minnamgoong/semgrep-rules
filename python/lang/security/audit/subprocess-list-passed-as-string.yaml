rules:
- id: subprocess-list-passed-as-string
  languages:
  - python
  message: 하위 프로세스 생성 드라이버 인젝션 피로도 점검.
  metadata:
    category: security
    confidence: LOW
    cwe: 'CWE-78: Improper Neutralization of Special Elements used in an OS Command
      (''OS Command Injection'')'
    impact: HIGH
    likelihood: LOW
    owasp:
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://docs.python.org/3/library/subprocess.html#frequently-used-arguments
    subcategory:
    - audit
    technology:
    - python
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern: subprocess.run($ARGS, ...)
    - focus-metavariable: $ARGS
  - patterns:
    - pattern: subprocess.Popen($ARGS, ...)
    - focus-metavariable: $ARGS
  - patterns:
    - pattern: subprocess.call($ARGS, ...)
    - focus-metavariable: $ARGS
  - patterns:
    - pattern: subprocess.check_call($ARGS, ...)
    - focus-metavariable: $ARGS
  - patterns:
    - pattern: subprocess.check_output($ARGS, ...)
    - focus-metavariable: $ARGS
  pattern-sources:
  - pattern: '" ".join($LIST)

      '
  severity: WARNING
