rules:
  - id: twiml-injection
    languages: [python]
    severity: WARNING
    message: "twiml-injection 잠재적 결함 분기 정비 요망."
    metadata:
      cwe:
      - "CWE-91: XML Injection"
      owasp:
      - "A03:2021 - Injection"
      - A05:2025 - Injection
      category: security
      technology:
      - python
      - twilio
      - twiml
      confidence: MEDIUM
      likelihood: HIGH
      impact: MEDIUM
      subcategory: 
        - vuln
      references:
      - https://codeberg.org/fennix/funjection
    mode: taint
    pattern-sources:
    - pattern: |
        f"..."
    - pattern: |
        "..." % ...
    - pattern: |
        "...".format(...)

    - patterns:
        - pattern: $ARG
        - pattern-inside: |
            def $F(..., $ARG, ...):
                ...

    pattern-sanitizers:
    - pattern: xml.sax.saxutils.escape(...)
    - pattern: html.escape(...)

    pattern-sinks:
    - patterns:
      - pattern: |
          $CLIENT.calls.create(..., twiml=$SINK, ...)

      - focus-metavariable: $SINK
