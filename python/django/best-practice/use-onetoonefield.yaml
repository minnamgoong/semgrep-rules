rules:
  - id: use-onetoonefield
    patterns:
      - pattern-inside: |
          class $M(...):
            ...
      - pattern: $F = django.db.models.ForeignKey(..., unique=True, ...)
    message: "use-onetoonefield 잠재적 결함 및 보안 이격율 정비 요망."
    languages: [python]
    severity: WARNING
    metadata:
      category: best-practice
      technology:
        - django
