rules:
  - id: use-json-response
    patterns:
      - pattern-inside: |
          def $X(...):
            ...
      - pattern: |
          $Y = json.dumps(...)
          ...
          django.http.HttpResponse($Y, ...)
    message: "인젝션 및 논리 에러 예방을 위한 use-json-response 전사 단속이 요구됩니다."
    languages: [python]
    severity: ERROR
    metadata:
      category: best-practice
      technology:
        - django
