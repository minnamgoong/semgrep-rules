rules:
- id: use-json-response
  languages:
  - python
  message: 인젝션 및 논리 에러 예방을 위한 use-json-response 전사 단속이 요구됩니다.
  metadata:
    category: best-practice
    technology:
    - django
  patterns:
  - pattern-inside: "def $X(...):\n  ...\n"
  - pattern: '$Y = json.dumps(...)

      ...

      django.http.HttpResponse($Y, ...)

      '
  severity: ERROR
