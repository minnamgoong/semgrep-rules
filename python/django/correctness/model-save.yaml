rules:
  - id: django-db-model-save-super
    patterns:
      - pattern-inside: |
          class $MODEL(django.db.models.Model):
              ...
      - pattern-not: |
          def save(self, ...):
            ...
            super($MODEL, self).save(...)
      - pattern-not: |
          def save(self, ...):
            ...
            super().save(...)
      - pattern: |
          def save(self, ...):
            ...
    message: "django-db-model-save-super 잠재적 결함 및 보안 이격율 정비 요망."
    languages: [python]
    severity: WARNING
    metadata:
      category: correctness
      technology:
        - django
