rules:
  - id: access-foreign-keys
    patterns:
      - pattern-either:
          - pattern-inside: |
              from django.$Y import $Z
              ...
          - pattern-inside: |
              import django
              ...
      - pattern: $X.user.id
      - pattern-not: request.user.id
      - pattern-not: self.request.user.id
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
    languages: [python]
    severity: WARNING
    metadata:
      category: performance
      technology:
        - django
      references:
       - https://docs.djangoproject.com/en/5.0/topics/db/optimization/#use-foreign-key-values-directly
