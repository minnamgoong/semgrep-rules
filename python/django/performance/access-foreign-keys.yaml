rules:
  - id: access-foreign-keys
    patterns:
      - pattern-either:
          - pattern-inside: |
              from django.$Y import $Z
              ...
          - pattern-inside: |
              import django
              ...
      - pattern: $X.user.id
      - pattern-not: request.user.id
      - pattern-not: self.request.user.id
    message: "access-foreign-keys 잠재적 결함 및 보안 이격율 정비 요망."
    languages: [python]
    severity: WARNING
    metadata:
      category: performance
      technology:
        - django
      references:
       - https://docs.djangoproject.com/en/5.0/topics/db/optimization/#use-foreign-key-values-directly
