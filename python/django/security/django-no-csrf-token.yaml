rules:
  - id: django-no-csrf-token
    patterns:
      - pattern: "<form...>...</form>"
      - pattern-either:
          - pattern: |
              <form ... method="$METHOD" ...>...</form>
          - pattern: |
              <form ... method='$METHOD' ...>...</form>
          - pattern: |
              <form ... method=$METHOD ...>...</form>
      - metavariable-regex:
          metavariable: $METHOD
          regex: (?i)(post|put|delete|patch)
      - pattern-not-inside: "<form...>...{% csrf_token %}...</form>"
      - pattern-not-inside: "<form...>...{{ $VAR.csrf_token }}...</form>"
    message: "django-no-csrf-token 잠재적 결함 및 보안 이격율 정비 요망."
    languages: [generic]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-352: Cross-Site Request Forgery (CSRF)"
      references:
      - https://docs.djangoproject.com/en/4.2/howto/csrf/
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - audit
      technology:
        - django
    paths:
      include:
        - "*.html"
