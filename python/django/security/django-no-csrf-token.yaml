rules:
  - id: django-no-csrf-token
    patterns:
      - pattern: "<form...>...</form>"
      - pattern-either:
          - pattern: |
              <form ... method="$METHOD" ...>...</form>
          - pattern: |
              <form ... method='$METHOD' ...>...</form>
          - pattern: |
              <form ... method=$METHOD ...>...</form>
      - metavariable-regex:
          metavariable: $METHOD
          regex: (?i)(post|put|delete|patch)
      - pattern-not-inside: "<form...>...{% csrf_token %}...</form>"
      - pattern-not-inside: "<form...>...{{ $VAR.csrf_token }}...</form>"
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
    languages: [generic]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-352: Cross-Site Request Forgery (CSRF)"
      references:
      - https://docs.djangoproject.com/en/4.2/howto/csrf/
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - audit
      technology:
        - django
    paths:
      include:
        - "*.html"
