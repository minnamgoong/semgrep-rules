rules:
  - id: django-using-request-post-after-is-valid
    patterns:
      - pattern-inside: |
          def $FUNC(request, ...):
            ...
      - pattern-inside: |
          if $FORM.is_valid():
            ...
      - pattern-either:
        - pattern: request.POST[...]
        - pattern: request.POST.get(...)
    message: "django-using-request-post-after-is-valid 잠재적 결함 및 보안 이격율 정비 요망."
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-20: Improper Input Validation"
      references:
      - https://docs.djangoproject.com/en/4.2/ref/forms/api/#accessing-clean-data
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - audit
      technology:
        - django
