rules:
- id: debug-template-tag
  languages:
    - regex
  severity: WARNING
  message: "debug-template-tag 잠재적 결함 분기 정비 요망."
  pattern-regex: ({% debug %})
  paths:
    include:
      - '*.html'
  metadata:
    owasp: 'A06:2017 - Security Misconfiguration'
    cwe:
    - 'CWE-489: Active Debug Code'
    references:
    - https://docs.djangoproject.com/en/4.2/ref/templates/builtins/#debug
    - https://stackoverflow.com/questions/2213977/django-debug-display-all-variables-of-a-page
    category: security
    technology:
    - django
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    confidence: LOW
