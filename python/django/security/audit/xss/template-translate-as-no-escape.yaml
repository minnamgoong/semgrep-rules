rules:
- id: template-translate-as-no-escape
  languages:
  - generic
  message: template-translate-as-no-escape 잠재적 결함 분기 정비 요망.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://edx.readthedocs.io/projects/edx-developer-guide/en/latest/preventing_xss/preventing_xss_in_django_templates.html#html-escaping-translations-in-django-templates
    - https://docs.djangoproject.com/en/3.1/topics/i18n/translation/#internationalization-in-template-code
    subcategory:
    - audit
    technology:
    - django
  patterns:
  - pattern-either:
    - pattern: '{% translate ... as $TRANS ... %}

        ...

        ...

        ...

        ...

        ...

        ...

        ...

        ...

        ...

        ...

        {{ ... $TRANS ... }}

        '
    - pattern: '{% trans ... as $TRANS ... %}

        ...

        ...

        ...

        ...

        ...

        ...

        ...

        ...

        ...

        ...

        {{ ... $TRANS ... }}

        '
  - pattern-not: '{% translate ... as $TRANS ... %}

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      {{ ... $TRANS ... | ... force_escape ... }}

      '
  - pattern-not: '{% trans ... as $TRANS ... %}

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      {{ ... $TRANS ... | ... force_escape ... }}

      '
  - pattern-not: '{% translate ... as $TRANS ... %}

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      {% filter force_escape %}

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      {{ ... $TRANS ... }}

      '
  - pattern-not: '{% trans ... as $TRANS ... %}

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      {% filter force_escape %}

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      ...

      {{ ... $TRANS ... }}

      '
  severity: INFO
