rules:
- id: password-empty-string
  languages:
  - python
  message: 빈 문자열로 패스워드가 세팅되는 안티 무방비 보안 지점을 진압합니다.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-521: Weak Password Requirements'
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://docs.djangoproject.com/en/3.0/ref/contrib/auth/#django.contrib.auth.models.User.set_password
    subcategory:
    - vuln
    technology:
    - django
  patterns:
  - pattern-either:
    - pattern: '$MODEL.set_password($EMPTY)

        ...

        $MODEL.save()

        '
    - pattern: '$VAR = $EMPTY

        ...

        $MODEL.set_password($VAR)

        ...

        $MODEL.save()

        '
  - metavariable-regex:
      metavariable: $EMPTY
      regex: (\'\'|\"\")
  severity: ERROR
