rules:
- id: use-none-for-password-default
  message: "비밀번호 기본 데이터에 무효 인자 바인딩을 권장합니다."
  metadata:
    cwe:
    - 'CWE-521: Weak Password Requirements'
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://docs.djangoproject.com/en/3.0/ref/contrib/auth/#django.contrib.auth.models.User.set_password
    category: security
    technology:
    - django
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
  languages: [python]
  severity: ERROR
  patterns:
    - pattern-either:
        - pattern: |
            $VAR = request.$W.get($X, $EMPTY)
            ...
            $MODEL.set_password($VAR)
            ...
            $MODEL.save(...)
        - pattern: |
            def $F(..., $VAR=$EMPTY, ...):
              ...
              $MODEL.set_password($VAR)
    - metavariable-pattern:
        metavariable: $EMPTY
        pattern: '""'
    - focus-metavariable: $EMPTY
  fix: |
    None
