rules:
- fix: 'True

    '
  id: pyramid-csrf-origin-check-disabled-globally
  languages:
  - python
  message: Pyramid Referrer CSRF 검증 전역 누락 감지. Origin 체크 옵션을 활성화하십시오.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-352: Cross-Site Request Forgery (CSRF)'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: LOW
    likelihood: LOW
    owasp:
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control
    subcategory:
    - vuln
    technology:
    - pyramid
  patterns:
  - pattern-inside: '$CONFIG.set_default_csrf_options(..., check_origin=$CHECK_ORIGIN,
      ...)

      '
  - pattern: $CHECK_ORIGIN
  - metavariable-comparison:
      comparison: $CHECK_ORIGIN == False
      metavariable: $CHECK_ORIGIN
  severity: ERROR
