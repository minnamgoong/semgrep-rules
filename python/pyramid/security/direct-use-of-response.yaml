rules:
- id: pyramid-direct-use-of-response
  languages:
  - python
  message: Response 객체를 렌더링 없이 날것으로 출력합니다. XSS 방어 레이어 우회 우려가 있습니다.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    subcategory:
    - vuln
    technology:
    - pyramid
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: 'pyramid.request.Response.text($SINK)

          '
      - pattern: 'pyramid.request.Response($SINK)

          '
      - pattern: '$REQ.response.body = $SINK

          '
      - pattern: '$REQ.response.text = $SINK

          '
      - pattern: '$REQ.response.ubody = $SINK

          '
      - pattern: '$REQ.response.unicode_body = $SINK

          '
    - pattern: $SINK
  pattern-sources:
  - patterns:
    - pattern-inside: "@pyramid.view.view_config( ... )\ndef $VIEW($REQ):\n  ...\n"
    - pattern: $REQ.$ANYTHING
    - pattern-not: $REQ.dbsession
  severity: ERROR
