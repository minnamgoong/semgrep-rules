rules:
- fix: 'True

    '
  id: pyramid-csrf-check-disabled-globally
  languages:
  - python
  message: Pyramid 전역 CSRF 방어가 비활성화되었습니다. 뷰 보호를 위해 토크나이저를 구동하십시오.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-352: Cross-Site Request Forgery (CSRF)'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: LOW
    likelihood: LOW
    owasp:
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control
    subcategory:
    - vuln
    technology:
    - pyramid
  patterns:
  - pattern-inside: '$CONFIG.set_default_csrf_options(..., require_csrf=$REQUIRE_CSRF,
      ...)

      '
  - pattern: $REQUIRE_CSRF
  - metavariable-comparison:
      comparison: $REQUIRE_CSRF == False
      metavariable: $REQUIRE_CSRF
  severity: ERROR
