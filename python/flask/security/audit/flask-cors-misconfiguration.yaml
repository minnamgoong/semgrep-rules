rules:
- id: flask-cors-misconfiguration
  languages:
  - python
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-942: Permissive Cross-domain Policy with Untrusted Domains'
    impact: HIGH
    likelihood: LOW
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://pypi.org/project/Flask-Cors/
    - https://flask-cors.readthedocs.io/en/latest/index.html
    subcategory:
    - audit
    technology:
    - flask
  patterns:
  - pattern-either:
    - pattern: '@cross_origin(..., origins="*", supports_credentials=True, ...)

        '
    - pattern: 'CORS(..., supports_credentials=True, origins="*", ...)

        '
    - pattern: 'CORS(..., resources={"...": {...,"origins": "*",

        "supports_credentials": True,...}})

        '
  severity: WARNING
