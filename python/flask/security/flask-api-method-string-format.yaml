rules:
- id: flask-api-method-string-format
  languages:
  - python
  message: 컨트롤러 연산에 유저 가변 문자열이 수동 가압됩니다. 인젝션 등 우회 타격 부재를 조심하십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-134: Use of Externally-Controlled Format String'
    impact: MEDIUM
    likelihood: LOW
    references:
    - https://cwe.mitre.org/data/definitions/134.html
    subcategory:
    - audit
    technology:
    - flask
  patterns:
  - pattern-either:
    - pattern: "def $METHOD(...,$ARG,...):\n  ...\n  $STRING = \"...\".format(...,$ARG,...)\n\
        \  ...\n  ... = requests.$REQMETHOD($STRING,...)\n"
    - pattern: "def $METHOD(...,$ARG,...):\n  ...\n  ... = requests.$REQMETHOD(\"\
        ...\".format(...,$ARG,...),...)\n"
  - pattern-inside: "class $CLASS(...):\n  method_decorators = ...\n  ...\n"
  severity: ERROR
