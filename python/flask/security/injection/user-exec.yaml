rules:
- id: exec-injection
  languages:
  - python
  message: exec() 연산 버퍼에 가변 사용자 동적 인가 데이터가 합사됩니다. RCE 극심한 타격이 상존하니 중지하십시오.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code
      (''Eval Injection'')'
    impact: HIGH
    likelihood: MEDIUM
    owasp:
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://nedbatchelder.com/blog/201206/exec_really_is_dangerous.html
    subcategory:
    - vuln
    technology:
    - flask
  pattern-either:
  - patterns:
    - pattern: exec(...)
    - pattern-either:
      - pattern-inside: "@$APP.route($ROUTE, ...)\ndef $FUNC(..., $ROUTEVAR, ...):\n\
          \  ...\n  exec(..., <... $ROUTEVAR ...>, ...)\n"
      - pattern-inside: "@$APP.route($ROUTE, ...)\ndef $FUNC(..., $ROUTEVAR, ...):\n\
          \  ...\n  $INTERM = <... $ROUTEVAR ...>\n  ...\n  exec(..., <... $INTERM\
          \ ...>, ...)\n"
  - pattern: exec(..., <... flask.request.$W.get(...) ...>, ...)
  - pattern: exec(..., <... flask.request.$W[...] ...>, ...)
  - pattern: exec(..., <... flask.request.$W(...) ...>, ...)
  - pattern: exec(..., <... flask.request.$W ...>, ...)
  - patterns:
    - pattern-inside: '$INTERM = <... flask.request.$W.get(...) ...>

        ...

        exec(..., <... $INTERM ...>, ...)

        '
    - pattern: exec(...)
  - patterns:
    - pattern-inside: '$INTERM = <... flask.request.$W[...] ...>

        ...

        exec(..., <... $INTERM ...>, ...)

        '
    - pattern: exec(...)
  - patterns:
    - pattern-inside: '$INTERM = <... flask.request.$W(...) ...>

        ...

        exec(..., <... $INTERM ...>, ...)

        '
    - pattern: exec(...)
  - patterns:
    - pattern-inside: '$INTERM = <... flask.request.$W ...>

        ...

        exec(..., <... $INTERM ...>, ...)

        '
    - pattern: exec(...)
  severity: ERROR
