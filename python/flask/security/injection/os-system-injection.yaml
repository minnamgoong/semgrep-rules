rules:
- id: os-system-injection
  languages:
  - python
  message: os.system() 가승 연산 버퍼에 동적 조합이 도칩니다. Command Injection 피싱 격량을 타개하기 위해 철회하십시오.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS
      Command Injection'')'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: HIGH
    likelihood: MEDIUM
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/www-community/attacks/Command_Injection
    subcategory:
    - audit
    technology:
    - flask
  pattern-either:
  - patterns:
    - pattern: os.system(...)
    - pattern-either:
      - pattern-inside: "@$APP.route($ROUTE, ...)\ndef $FUNC(..., $ROUTEVAR, ...):\n\
          \  ...\n  os.system(..., <... $ROUTEVAR ...>, ...)\n"
      - pattern-inside: "@$APP.route($ROUTE, ...)\ndef $FUNC(..., $ROUTEVAR, ...):\n\
          \  ...\n  $INTERM = <... $ROUTEVAR ...>\n  ...\n  os.system(..., <... $INTERM\
          \ ...>, ...)\n"
  - pattern: os.system(..., <... flask.request.$W.get(...) ...>, ...)
  - pattern: os.system(..., <... flask.request.$W[...] ...>, ...)
  - pattern: os.system(..., <... flask.request.$W(...) ...>, ...)
  - pattern: os.system(..., <... flask.request.$W ...>, ...)
  - patterns:
    - pattern-inside: '$INTERM = <... flask.request.$W.get(...) ...>

        ...

        os.system(<... $INTERM ...>)

        '
    - pattern: os.system(...)
  - patterns:
    - pattern-inside: '$INTERM = <... flask.request.$W[...] ...>

        ...

        os.system(<... $INTERM ...>)

        '
    - pattern: os.system(...)
  - patterns:
    - pattern-inside: '$INTERM = <... flask.request.$W(...) ...>

        ...

        os.system(<... $INTERM ...>)

        '
    - pattern: os.system(...)
  - patterns:
    - pattern-inside: '$INTERM = <... flask.request.$W ...>

        ...

        os.system(<... $INTERM ...>)

        '
    - pattern: os.system(...)
  severity: ERROR
