rules:
  - id: flask-class-method-get-side-effects
    patterns:
      - pattern-either:
          - pattern: |
              def get(self,...):
                  ...
                  $METHOD(...)
          - pattern: |
              def get(self,...):
                  ...
                  $VAR = $METHOD(...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: (?i)(create|update|delete).*
    message: "flask-class-method-get-side-effects 잠재적 결함 및 보안 이격율 정비 요망."
    severity: WARNING
    languages: [python]
    metadata:
      category: best-practice
      technology:
        - flask
