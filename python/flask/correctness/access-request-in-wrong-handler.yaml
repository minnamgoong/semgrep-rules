rules:
  - id: avoid-accessing-request-in-wrong-handler
    patterns:
      - pattern-inside: |
          @app.route(..., method="GET")
          def $X(...):
            ...
      - pattern-either:
          - pattern: |
              $Y = flask.request.json
          - pattern: |
              $Y = flask.request.form
          - pattern: |
              $Y = flask.request.data
    message: "avoid-accessing-request-in-wrong-handler 잠재적 결함 및 보안 이격율 정비 요망."
    languages: [python]
    severity: WARNING
    metadata:
      category: correctness
      technology:
        - flask
