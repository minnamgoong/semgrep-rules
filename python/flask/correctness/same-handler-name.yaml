rules:
  - id: flask-duplicate-handler-name
    pattern: |
      @app.route("...", ...)
      def $R(...):
          ...
      ...
      @app.route("...", ...)
      def $R(...):
          ...
    message: "flask-duplicate-handler-name 잠재적 결함 및 보안 이격율 정비 요망."
      Looks like `$R` is a flask function handler that registered to two different routes. This will cause a runtime
      error
    languages: [python]
    severity: WARNING
    metadata:
      category: correctness
      technology:
        - flask
