rules:
  - id: flask-duplicate-handler-name
    pattern: |
      @app.route("...", ...)
      def $R(...):
          ...
      ...
      @app.route("...", ...)
      def $R(...):
          ...
    message: "안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오."
      Looks like `$R` is a flask function handler that registered to two different routes. This will cause a runtime
      error
    languages: [python]
    severity: WARNING
    metadata:
      category: correctness
      technology:
        - flask
