rules:
- id: jwt-simple-noverify
  languages:
  - javascript
  - typescript
  message: jwt-simple 디코딩 수동 호출 시 서명 검증(verify) 단계가 누락되었습니다. 변조 토큰 우회를 막기 위해 반드시 검증
    옵션을 활성화하세요.
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-287: Improper Authentication'
    - 'CWE-345: Insufficient Verification of Data Authenticity'
    - 'CWE-347: Improper Verification of Cryptographic Signature'
    impact: HIGH
    likelihood: MEDIUM
    owasp:
    - A05:2021 - Security Misconfiguration
    - A07:2021 - Identification and Authentication Failures
    - A02:2025 - Security Misconfiguration
    - A07:2025 - Authentication Failures
    references:
    - https://www.npmjs.com/package/jwt-simple
    - https://cwe.mitre.org/data/definitions/287
    - https://cwe.mitre.org/data/definitions/345
    - https://cwe.mitre.org/data/definitions/347
    subcategory:
    - vuln
    technology:
    - jwt-simple
    - jwt
  patterns:
  - pattern-inside: '$JWT = require(''jwt-simple'');

      ...

      '
  - pattern: $JWT.decode($TOKEN, $SECRET, $NOVERIFY, ...)
  - metavariable-pattern:
      metavariable: $NOVERIFY
      patterns:
      - pattern-either:
        - pattern: 'true

            '
        - pattern: '"..."

            '
  severity: ERROR
