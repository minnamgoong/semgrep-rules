rules:
- id: hardcoded-jwt-secret
  languages:
  - javascript
  - typescript
  message: JWT 토큰 서명 및 디코드 검증 누락 여부 점검.
  metadata:
    asvs:
      control_id: 3.5.2 Static API keys or secret
      control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x12-V3-Session-management.md#v35-token-based-session-management
      section: 'V3: Session Management Verification Requirements'
      version: '4'
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    interfile: true
    likelihood: HIGH
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    subcategory:
    - vuln
    technology:
    - jose
    - jwt
    - secrets
  options:
    interfile: true
    symbolic_propagation: true
  patterns:
  - pattern-inside: '$JOSE = require("jose");

      ...

      '
  - pattern-either:
    - pattern-inside: 'var {JWT} = $JOSE;

        ...

        '
    - pattern-inside: 'var {JWK, JWT} = $JOSE;

        ...

        '
    - pattern-inside: 'const {JWT} = $JOSE;

        ...

        '
    - pattern-inside: 'const {JWK, JWT} = $JOSE;

        ...

        '
    - pattern-inside: 'let {JWT} = $JOSE;

        ...

        '
    - pattern-inside: 'let {JWK, JWT} = $JOSE;

        ...

        '
  - pattern-either:
    - pattern: 'JWT.verify($P, "...", ...);

        '
    - pattern: 'JWT.sign($P, "...", ...);

        '
    - pattern: "JWT.verify($P, JWK.asKey(\"...\"), ...);     \n"
    - pattern: '$JWT.sign($P, JWK.asKey("..."), ...);

        '
  severity: WARNING
