rules:
- id: lazy-load-module
  languages:
  - javascript
  - typescript
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: best-practice
    references:
    - https://nodesecroadmap.fyi/chapter-2/dynamism.html
    - https://github.com/goldbergyoni/nodebestpractices#-38-require-modules-first-not-inside-functions
    technology:
    - javascript
  patterns:
  - pattern: require(...)
  - pattern-inside: "function $NAME(...) {\n    ...\n}\n"
  severity: WARNING
