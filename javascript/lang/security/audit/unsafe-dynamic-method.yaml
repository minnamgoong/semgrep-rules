rules:
- id: unsafe-dynamic-method
  languages:
  - javascript
  - typescript
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    cwe2022-top25: true
    impact: LOW
    likelihood: LOW
    owasp:
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    subcategory:
    - audit
    technology:
    - javascript
  patterns:
  - pattern-either:
    - pattern: $OBJ[$X](...)
    - pattern: '$Y = $OBJ[$X]

        ...

        $Y(...)

        '
  - metavariable-pattern:
      metavariable: $X
      patterns:
      - pattern-not: '"..."

          '
      - pattern-not: '($X: float)

          '
  - pattern-not-inside: 'for (...) {...}

      '
  - pattern-not-inside: '$SMTH.forEach(...)

      '
  - pattern-not-inside: '$SMTH.map(...)

      '
  - pattern-not-inside: '$SMTH.reduce(...)

      '
  - pattern-not-inside: '$SMTH.reduceRight(...)

      '
  - pattern-not-inside: "if (<... $OBJ.hasOwnProperty(...) ...>) {\n  ...\n}\n...\n"
  severity: WARNING
