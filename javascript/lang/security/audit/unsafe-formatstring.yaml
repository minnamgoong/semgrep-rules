rules:
- id: unsafe-formatstring
  languages:
  - javascript
  - typescript
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-134: Use of Externally-Controlled Format String'
    impact: LOW
    likelihood: MEDIUM
    owasp:
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    references:
    - https://cwe.mitre.org/data/definitions/134.html
    subcategory:
    - audit
    technology:
    - javascript
  mode: taint
  pattern-sinks:
  - patterns:
    - focus-metavariable: $STR
    - pattern-either:
      - pattern: 'console.$LOG($STR,$PARAM,...)

          '
      - patterns:
        - pattern-inside: '$UTIL = require(''util'')

            ...

            '
        - pattern: '$UTIL.format($STR,$PARAM,...)

            '
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: $X + $Y
      - pattern: $X.concat($Y)
      - pattern: '`...${...}...`

          '
    - pattern-not: '"..." + "..."

        '
    - pattern-not: '$X.concat("...")

        '
  severity: INFO
