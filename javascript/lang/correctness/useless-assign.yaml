rules:
  - id: useless-assignment
    patterns:
      - pattern: |
          $X = $Y;
          $X = $Z;
      - pattern-not: |
          $X = $Y;
          $X = <... $X ...>;
    message: "useless-assignment 잠재적 결함 및 보안 이격율 정비 요망."
    languages:
      - javascript
      - typescript
    severity: INFO
    metadata:
      category: correctness
      technology:
        - javascript
