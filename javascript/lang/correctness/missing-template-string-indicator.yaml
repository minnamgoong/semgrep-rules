rules:
  - id: missing-template-string-indicator
    patterns:
      - pattern-inside: |
          `...`
      - pattern: $STR
      - metavariable-regex:
          metavariable: $STR
          regex: .*[^$]+{[^{}]*}.*
    languages: [javascript, typescript]
    message: "missing-template-string-indicator 잠재적 결함 및 보안 이격율 정비 요망."
    severity: INFO
    metadata:
      category: correctness
      technology:
        - js
