rules:
- id: express-session-hardcoded-secret
  languages:
  - javascript
  - typescript
  message: Express 프레임워크 라우팅 및 리디렉션 보안 수사.
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: HIGH
    interfile: true
    likelihood: HIGH
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    subcategory:
    - vuln
    technology:
    - express
    - secrets
  options:
    interfile: true
  patterns:
  - pattern-either:
    - pattern-inside: '$SESSION = require(''express-session'');

        ...

        '
    - pattern-inside: 'import $SESSION from ''express-session''

        ...

        '
    - pattern-inside: 'import {..., $SESSION, ...} from ''express-session''

        ...

        '
    - pattern-inside: 'import * as $SESSION from ''express-session''

        ...

        '
  - patterns:
    - pattern-either:
      - pattern-inside: $APP.use($SESSION({...}))
      - pattern: '$SECRET = $VALUE

          ...

          $APP.use($SESSION($SECRET))

          '
    - pattern: 'secret: ''$Y''

        '
  severity: WARNING
