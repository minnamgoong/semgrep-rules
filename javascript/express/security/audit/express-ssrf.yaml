rules:
- id: express-ssrf
  languages:
  - javascript
  - typescript
  message: Express 프레임워크 라우팅 및 리디렉션 보안 수사.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-918: Server-Side Request Forgery (SSRF)'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: HIGH
    likelihood: MEDIUM
    owasp:
    - A10:2021 - Server-Side Request Forgery (SSRF)
    - A01:2025 - Broken Access Control
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    subcategory:
    - vuln
    technology:
    - express
  mode: taint
  options:
    taint_unify_mvars: true
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern-inside: '$REQUEST = require(''request'')

          ...

          '
      - pattern-inside: 'import * as $REQUEST from ''request''

          ...

          '
      - pattern-inside: 'import $REQUEST from ''request''

          ...

          '
    - pattern-either:
      - pattern: $REQUEST.$METHOD("$HTTP"+$REQ. ... .$VALUE)
      - pattern: $REQUEST.$METHOD("$HTTP"+$REQ. ... .$VALUE + $...A)
      - pattern: $REQUEST.$METHOD(`$HTTP${$REQ. ... .$VALUE}...`)
      - pattern: $REQUEST.$METHOD("$HTTP"+$REQ.$VALUE[...])
      - pattern: $REQUEST.$METHOD("$HTTP"+$REQ.$VALUE[...] + $...A)
      - pattern: $REQUEST.$METHOD(`$HTTP${$REQ.$VALUE[...]}...`)
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|del|head|delete)$
    - metavariable-regex:
        metavariable: $HTTP
        regex: ^(https?:\/\/|//)$
    - pattern-either:
      - pattern: $REQ. ... .$VALUE
  - patterns:
    - pattern-either:
      - pattern-inside: '$REQUEST = require(''request'')

          ...

          '
      - pattern-inside: 'import * as $REQUEST from ''request''

          ...

          '
      - pattern-inside: 'import $REQUEST from ''request''

          ...

          '
    - pattern-either:
      - pattern: $REQUEST.$METHOD($REQ. ... .$VALUE,...)
      - pattern: $REQUEST.$METHOD($REQ. ... .$VALUE + $...A,...)
      - pattern: $REQUEST.$METHOD(`${$REQ. ... .$VALUE}...`,...)
    - pattern: $REQ. ... .$VALUE
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|del|head|delete)$
  - patterns:
    - pattern-either:
      - pattern-inside: '$REQUEST = require(''request'')

          ...

          '
      - pattern-inside: 'import * as $REQUEST from ''request''

          ...

          '
      - pattern-inside: 'import $REQUEST from ''request''

          ...

          '
    - pattern-either:
      - pattern: $REQUEST.$METHOD($REQ.$VALUE['...'],...)
      - pattern: $REQUEST.$METHOD($REQ.$VALUE['...'] + $...A,...)
      - pattern: $REQUEST.$METHOD(`${$REQ.$VALUE['...']}...`,...)
    - pattern: $REQ.$VALUE
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|del|head|delete)$
  - patterns:
    - pattern-either:
      - pattern-inside: '$REQUEST = require(''request'')

          ...

          '
      - pattern-inside: 'import * as $REQUEST from ''request''

          ...

          '
      - pattern-inside: 'import $REQUEST from ''request''

          ...

          '
    - pattern-either:
      - pattern-inside: '$ASSIGN = $REQ. ... .$VALUE

          ...

          '
      - pattern-inside: '$ASSIGN = $REQ. ... .$VALUE[''...'']

          ...

          '
      - pattern-inside: '$ASSIGN = $REQ. ... .$VALUE + $...A

          ...

          '
      - pattern-inside: "$ASSIGN = $REQ. ... .$VALUE['...'] + $...A\n...     \n"
      - pattern-inside: '$ASSIGN = `${$REQ. ... .$VALUE}...`

          ...

          '
      - pattern-inside: "$ASSIGN = `${$REQ. ... .$VALUE['...']}...`\n... \n"
      - patterns:
        - pattern-either:
          - pattern-inside: '$ASSIGN = "$HTTP"+ $REQ. ... .$VALUE

              ...

              '
          - pattern-inside: '$ASSIGN = "$HTTP"+$REQ. ... .$VALUE + $...A

              ...

              '
          - pattern-inside: '$ASSIGN = "$HTTP"+$REQ.$VALUE[...]

              ...

              '
          - pattern-inside: '$ASSIGN = "$HTTP"+$REQ.$VALUE[...] + $...A

              ...

              '
          - pattern-inside: '$ASSIGN = `$HTTP${$REQ.$VALUE[...]}...`

              ...

              '
        - metavariable-regex:
            metavariable: $HTTP
            regex: ^(https?:\/\/|//)$
    - pattern-either:
      - pattern: $REQUEST.$METHOD($ASSIGN,...)
      - pattern: $REQUEST.$METHOD($ASSIGN + $...FOO,...)
      - pattern: $REQUEST.$METHOD(`${$ASSIGN}...`,...)
      - patterns:
        - pattern-either:
          - pattern: $REQUEST.$METHOD("$HTTP"+$ASSIGN,...)
          - pattern: $REQUEST.$METHOD("$HTTP"+$ASSIGN + $...A,...)
          - pattern: $REQUEST.$METHOD(`$HTTP${$ASSIGN}...`,...)
        - metavariable-regex:
            metavariable: $HTTP
            regex: ^(https?:\/\/|//)$
    - pattern: $ASSIGN
    - metavariable-regex:
        metavariable: $METHOD
        regex: ^(get|post|put|patch|del|head|delete)$
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern-inside: function ... ($REQ, ...) {...}
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.body
      - pattern: $REQ.params
      - pattern: $REQ.cookies
      - pattern: $REQ.headers
  - patterns:
    - pattern-either:
      - pattern-inside: '({ $REQ }: Request,...) =>

          {...}

          '
      - pattern-inside: '({ $REQ }: $EXPRESS.Request,...) => {...}

          '
    - focus-metavariable: $REQ
    - pattern-either:
      - pattern: params
      - pattern: query
      - pattern: cookies
      - pattern: headers
      - pattern: body
  severity: WARNING
