rules:
- id: express-check-csurf-middleware-usage
  languages:
  - javascript
  - typescript
  message: Express 프레임워크 라우팅 및 리디렉션 보안 수사.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-352: Cross-Site Request Forgery (CSRF)'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: HIGH
    likelihood: LOW
    owasp:
    - A01:2021 - Broken Access Control
    - A01:2025 - Broken Access Control
    references:
    - https://www.npmjs.com/package/csurf
    - https://www.npmjs.com/package/csrf
    - https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
    subcategory:
    - audit
    technology:
    - javascript
    - typescript
    - express
  patterns:
  - pattern-inside: '$EXPRESS = require(''express'')

      ...

      '
  - pattern-not-inside: 'import {$CSRF} from ''csurf''

      ...

      '
  - pattern-not-inside: 'require(''csurf'')

      ...

      '
  - pattern-not-inside: 'import {$CSRF} from ''csrf''

      ...

      '
  - pattern-not-inside: 'require(''csrf'')

      ...

      '
  - pattern: '$APP = $EXPRESS()

      '
  severity: INFO
