rules:
- id: template-and-attributes
  languages:
  - regex
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://pugjs.org/language/attributes.html#attributes
    subcategory:
    - audit
    technology:
    - express
  paths:
    include:
    - '*.pug'
  pattern-regex: .*&attributes.*
  severity: WARNING
