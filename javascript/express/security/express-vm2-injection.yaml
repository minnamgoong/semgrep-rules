rules:
- id: express-vm2-injection
  languages:
  - javascript
  - typescript
  message: Express 프레임워크 라우팅 및 리디렉션 보안 수사.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: MEDIUM
    owasp:
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Injection_Prevention_Cheat_Sheet.html
    subcategory:
    - vuln
    technology:
    - express
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern-inside: 'require(''vm2'')

        ...

        '
    - pattern-either:
      - patterns:
        - pattern-either:
          - pattern-inside: '$VM = new VM(...)

              ...

              '
          - pattern-inside: '$VM = new NodeVM(...)

              ...

              '
        - pattern: '$VM.run(...)

            '
      - pattern: 'new VM(...).run(...)

          '
      - pattern: 'new NodeVM(...).run(...)

          '
      - pattern: 'new VMScript(...)

          '
      - pattern: 'new VM(...)

          '
      - pattern: new NodeVM(...)
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern-inside: function ... ($REQ, $RES) {...}
      - pattern-inside: function ... ($REQ, $RES, $NEXT) {...}
      - patterns:
        - pattern-either:
          - pattern-inside: $APP.$METHOD(..., function $FUNC($REQ, $RES) {...})
          - pattern-inside: $APP.$METHOD(..., function $FUNC($REQ, $RES, $NEXT) {...})
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|head|delete|options)$
    - pattern-either:
      - pattern: $REQ.query
      - pattern: $REQ.body
      - pattern: $REQ.params
      - pattern: $REQ.cookies
      - pattern: $REQ.headers
  - patterns:
    - pattern-either:
      - pattern-inside: '({ $REQ }: Request,$RES: Response, $NEXT: NextFunction) =>

          {...}

          '
      - pattern-inside: '({ $REQ }: Request,$RES: Response) => {...}

          '
    - focus-metavariable: $REQ
    - pattern-either:
      - pattern: params
      - pattern: query
      - pattern: cookies
      - pattern: headers
      - pattern: body
  severity: WARNING
