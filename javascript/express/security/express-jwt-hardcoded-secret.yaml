rules:
- id: express-jwt-hardcoded-secret
  languages:
  - javascript
  - typescript
  message: JWT 토큰 서명 및 디코드 검증 누락 여부 점검.
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    interfile: true
    likelihood: HIGH
    owasp:
    - A07:2021 - Identification and Authentication Failures
    - A07:2025 - Authentication Failures
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
    subcategory:
    - audit
    technology:
    - express
    - secrets
  options:
    interfile: true
  patterns:
  - pattern-either:
    - pattern-inside: '$JWT = require(''express-jwt'');

        ...

        '
    - pattern-inside: 'import $JWT from ''express-jwt'';

        ...

        '
    - pattern-inside: 'import * as $JWT from ''express-jwt'';

        ...

        '
    - pattern-inside: 'import { ..., $JWT, ... } from ''express-jwt'';

        ...

        '
  - pattern-either:
    - pattern: '$JWT({...,secret: "$Y",...},...)

        '
    - pattern: '$OPTS = "$Y";

        ...

        $JWT({...,secret: $OPTS},...);

        '
  - focus-metavariable: $Y
  severity: WARNING
