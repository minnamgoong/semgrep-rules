rules:
- id: insecure-innerhtml
  languages:
  - javascript
  - typescript
  message: $EL.innerHTML에 사용자 제어 데이터가 대입되고 있습니다. XSS 취약점을 유발하는 안티 패턴이므로 textContent
    대체 사용 등을 고려하세요.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: LOW
    likelihood: LOW
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    subcategory:
    - audit
    technology:
    - browser
  patterns:
  - pattern: '$EL.innerHTML = $HTML;

      '
  - pattern-not: '$EL.innerHTML = "...";

      '
  severity: ERROR
