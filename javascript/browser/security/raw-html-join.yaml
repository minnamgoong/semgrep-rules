rules:
- id: raw-html-join
  languages:
  - javascript
  - typescript
  message: HTML 템플릿 가속 피싱 대응.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: LOW
    likelihood: LOW
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/www-community/attacks/xss/
    subcategory:
    - audit
    technology:
    - browser
  patterns:
  - pattern-either:
    - patterns:
      - pattern: '[..., $STRING, ...].join(...)

          '
      - metavariable-pattern:
          language: generic
          metavariable: $STRING
          patterns:
          - pattern-either:
            - pattern: '... </$TAG

                '
            - pattern: '<$TAG ...

                '
      - pattern-not: '[..., "$HARDCODED", ...].join("...")

          '
  severity: WARNING
