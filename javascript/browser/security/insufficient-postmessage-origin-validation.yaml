rules:
- id: insufficient-postmessage-origin-validation
  languages:
  - javascript
  - typescript
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-345: Insufficient Verification of Data Authenticity'
    impact: LOW
    likelihood: LOW
    owasp:
    - A08:2021 - Software and Data Integrity Failures
    - A08:2025 - Software or Data Integrity Failures
    references:
    - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures
    subcategory:
    - audit
    technology:
    - browser
  pattern-either:
  - patterns:
    - pattern: 'window.addEventListener(''message'', $FUNC, ...)

        '
    - metavariable-pattern:
        metavariable: $FUNC
        patterns:
        - pattern: 'function($OBJ) { ... }

            '
        - pattern-not: 'function($OBJ) { ... if (<... $OBJ.origin ...>) { ... } ...
            }

            '
  - patterns:
    - pattern-either:
      - pattern-inside: 'function $FNAME($OBJ) { $CONTEXT }

          ...

          '
      - pattern-inside: '$FNAME = (...) => { $CONTEXT }

          ...

          '
    - pattern: 'window.addEventListener(''message'', $FNAME,...)

        '
    - metavariable-pattern:
        metavariable: $CONTEXT
        patterns:
        - pattern-not: '... if (<... $OBJ.origin ...>) { ... } ...

            '
  severity: WARNING
