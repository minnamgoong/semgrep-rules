rules:
- id: insecure-document-method
  languages:
  - javascript
  - typescript
  message: document.write 또는 innerHTML 에 외부 오염 데이터가 탑재되어 DOM-XSS 위험이 보입니다. 안전한 DOM
    트리 생성 메서드로 변경하세요.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: LOW
    likelihood: LOW
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    subcategory:
    - audit
    technology:
    - browser
  patterns:
  - pattern-either:
    - pattern: '$EL.innerHTML = $HTML;

        '
    - pattern: '$EL.outerHTML = $HTML;

        '
    - pattern: document.write(...)
  - pattern-not: '$EL.innerHTML = "...";

      '
  - pattern-not: '$EL.outerHTML = "...";

      '
  - pattern-not: document.write("...")
  severity: ERROR
