rules:
- id: shelljs-exec-injection
  languages:
  - javascript
  - typescript
  message: shelljs.exec() 호출 연산에 외부 사용자 오염 가변 데이터가 주입되었습니다. RCE(원격코드실행) 위협이 가중되므로
    인자 분할 형식으로 전환하십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS
      Command Injection'')'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: HIGH
    likelihood: LOW
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    subcategory:
    - audit
    technology:
    - shelljs
  patterns:
  - pattern-inside: 'require(''shelljs'');

      ...

      '
  - pattern-not-inside: 'require(''shelljs'');

      ...

      var $INPUT = "...";

      ...

      '
  - pattern: $SHELL.exec($INPUT,...)
  - pattern-not: $SHELL.exec("...",...)
  severity: ERROR
