rules:
- id: calling-set-state-on-current-state
  languages:
  - javascript
  message: React Hooks에서 현재 상태(state) 값을 그대로 다시 setState에 주입하는 무의미한 연산이 감지되었습니다. 로직
    실수를 검토하세요.
  metadata:
    category: correctness
    technology:
    - react
  patterns:
  - pattern: $Y($X);
  - pattern-inside: 'const [$X, $Y] = useState(...);

      ...

      '
  severity: ERROR
