rules:
- id: expat-xxe
  languages:
  - javascript
  - typescript
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-611: Improper Restriction of XML External Entity Reference'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A04:2017 - XML External Entities (XXE)
    - A05:2021 - Security Misconfiguration
    - A02:2025 - Security Misconfiguration
    references:
    - https://owasp.org/Top10/A05_2021-Security_Misconfiguration
    subcategory:
    - audit
    technology:
    - node-expat
  patterns:
  - pattern-either:
    - pattern: 'var $EXPAT = require(''node-expat'');

        ...

        new $EXPAT.Parser(...);

        ...

        $PARSER.parse(...);

        '
    - pattern: 'var $EXPAT = require(''node-expat'');

        ...

        new $EXPAT.Parser(...);

        ...

        $PARSER.write(...);

        '
    - pattern: 'require(''node-expat'');

        ...

        new Parser(...);

        ...

        $PARSER.parse(...);

        '
    - pattern: 'require(''node-expat'');

        ...

        new Parser(...);

        ...

        $PARSER.write(...);

        '
  - pattern-not: 'var $EXPAT = require(''node-expat'');

      ...

      new $EXPAT.Parser(...);

      ...

      $PARSER.parse("...");

      '
  - pattern-not: 'var $EXPAT = require(''node-expat'');

      ...

      new $EXPAT.Parser(...);

      ...

      $PARSER.write("...");

      '
  - pattern-not: 'require(''node-expat'');

      ...

      new Parser(...);

      ...

      $PARSER.parse("...");

      '
  - pattern-not: 'require(''node-expat'');

      ...

      new Parser(...);

      ...

      $PARSER.write("...");

      '
  - pattern-not: '$X = "...";

      ...

      $PARSER.parse($X);

      '
  - pattern-not: '$X = "...";

      ...

      $PARSER.write($X);'
  severity: WARNING
