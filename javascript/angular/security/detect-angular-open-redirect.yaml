rules:
- id: detect-angular-open-redirect
  languages:
  - javascript
  - typescript
  message: $window.location.href 연산에 사용자 입력이 그대로 대입되어 오픈 리디렉션 위협이 도사립니다. 도메인 화이트리스트
    검출 후 도약시키세요.
  metadata:
    asvs:
      control_id: 5.5.1 Insecue Redirect
      control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x13-V5-Validation-Sanitization-Encoding.md#v51-input-validation
      section: V5 Validation, Sanitization and Encoding
      version: '4'
    category: security
    confidence: LOW
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://docs.angularjs.org/api/ng/service/$sce#trustAsJs
    - https://owasp.org/www-chapter-london/assets/slides/OWASPLondon20170727_AngularJS.pdf
    subcategory:
    - audit
    technology:
    - angular
  patterns:
  - pattern: '$window.location.href = ...

      '
  - pattern-not: '$window.location.href = "..."

      '
  severity: ERROR
