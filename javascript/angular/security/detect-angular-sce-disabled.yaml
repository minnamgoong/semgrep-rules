rules:
- id: detect-angular-sce-disabled
  languages:
  - javascript
  - typescript
  message: $sceProvider가 false로 설정되어 엄격한 컨텍스트 이스케이프가 비활성화되었습니다. XSS 공격 방어를 위해 SCE를
    활성화해야 합니다.
  metadata:
    category: security
    confidence: HIGH
    cwe:
    - 'CWE-79: Improper Neutralization of Input During Web Page Generation (''Cross-site
      Scripting'')'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: HIGH
    owasp:
    - A07:2017 - Cross-Site Scripting (XSS)
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://docs.angularjs.org/api/ng/service/$sce
    - https://owasp.org/www-chapter-london/assets/slides/OWASPLondon20170727_AngularJS.pdf
    subcategory:
    - vuln
    technology:
    - angular
  pattern: '$sceProvider.enabled(false);

    '
  severity: ERROR
