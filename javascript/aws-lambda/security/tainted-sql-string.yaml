rules:
- id: tainted-sql-string
  languages:
  - javascript
  - typescript
  message: Lambda 가동 연산 스택에 유저 기반 SQL 문자열 조립이 탐지되었습니다. Parameterized Query를 사용하여 인젝션
    요인을 차단하십시오.
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command
      (''SQL Injection'')'
    cwe2021-top25: true
    cwe2022-top25: true
    impact: MEDIUM
    likelihood: LOW
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://owasp.org/www-community/attacks/SQL_Injection
    subcategory:
    - vuln
    technology:
    - aws-lambda
  mode: taint
  pattern-sinks:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern-either:
          - pattern: '"$SQLSTR" + $EXPR

              '
          - pattern: '"$SQLSTR".concat(...)

              '
          - pattern: util.format($SQLSTR, ...)
        - metavariable-regex:
            metavariable: $SQLSTR
            regex: .*\b(?i)(select|delete|insert|create|update|alter|drop)\b.*
      - patterns:
        - pattern: '`...${...}...`

            '
        - pattern-regex: '.*\b(?i)(select|delete|insert|create|update|alter|drop)\b.*

            '
    - pattern-not-inside: 'console.$LOG(...)

        '
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern-inside: "exports.handler = function ($EVENT, ...) {\n  ...\n}\n"
      - pattern-inside: 'function $FUNC ($EVENT, ...) {...}

          ...

          exports.handler = $FUNC

          '
      - pattern-inside: '$FUNC = function ($EVENT, ...) {...}

          ...

          exports.handler = $FUNC

          '
    - pattern: $EVENT
  severity: ERROR
