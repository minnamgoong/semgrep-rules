rules:
- id: dynamodb-request-object
  languages:
  - javascript
  - typescript
  message: DynamoDB 쿼리 매개변수 집계 시 $EVENT 유입 데이터가 소요됩니다. NoSQL 인젝션을 피하기 위해 입력 데이터를 정적
    한정시키세요.
  metadata:
    category: security
    confidence: MEDIUM
    cwe:
    - 'CWE-943: Improper Neutralization of Special Elements in Data Query Logic'
    impact: HIGH
    likelihood: MEDIUM
    owasp:
    - A01:2017 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    subcategory:
    - vuln
    technology:
    - javascript
    - aws-lambda
    - dynamodb
  mode: taint
  pattern-sanitizers:
  - patterns:
    - pattern: '{...}

        '
  pattern-sinks:
  - patterns:
    - focus-metavariable: $SINK
    - pattern: '$DC.$METHOD($SINK, ...)

        '
    - metavariable-regex:
        metavariable: $METHOD
        regex: (query|send|scan|delete|put|transactWrite|update|batchExecuteStatement|executeStatement|executeTransaction|transactWriteItems)
    - pattern-either:
      - pattern-inside: '$DC = new $AWS.DocumentClient(...);

          ...

          '
      - pattern-inside: '$DC = new $AWS.DynamoDB(...);

          ...

          '
      - pattern-inside: '$DC = new DynamoDBClient(...);

          ...

          '
      - pattern-inside: '$DC = DynamoDBDocumentClient.from(...);

          ...

          '
  pattern-sources:
  - patterns:
    - pattern: $EVENT
    - pattern-either:
      - pattern-inside: "exports.handler = function ($EVENT, ...) {\n  ...\n}\n"
      - pattern-inside: 'function $FUNC ($EVENT, ...) {...}

          ...

          exports.handler = $FUNC

          '
      - pattern-inside: '$FUNC = function ($EVENT, ...) {...}

          ...

          exports.handler = $FUNC

          '
  severity: ERROR
