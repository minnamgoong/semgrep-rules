rules:
- id: sequelize-tls-disabled-cert-validation
  languages:
  - javascript
  - typescript
  message: 'Sequelize 설정 중 인증서 검증을 우회(rejectUnauthorized: false)하는 상태가 감지되었습니다. 중간자
    공격에 도출되므로 프로덕션 배포 시 철회하십시오.'
  metadata:
    category: security
    confidence: LOW
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    cwe2022-top25: true
    impact: LOW
    likelihood: LOW
    owasp:
    - A03:2021 - Injection
    - A05:2025 - Injection
    references:
    - https://node-postgres.com/features/ssl
    - https://nodejs.org/api/tls.html#tls_class_tls_tlssocket
    - https://nodejs.org/api/tls.html#tls_tls_createsecurecontext_options
    subcategory:
    - audit
    technology:
    - sequelize
  patterns:
  - pattern: "{\n  host: $HOST,\n  database: $DATABASE,\n  dialect: $DIALECT,\n  dialectOptions:\
      \ {\n    ssl: {\n      rejectUnauthorized: false\n    }\n  }\n }\n"
  - metavariable-regex:
      metavariable: $DIALECT
      regex: '[''"](mariadb|mysql|postgres)[''"]'
  severity: ERROR
