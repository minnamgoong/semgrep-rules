rules:
- id: - id: useless-cat
  pattern-either:
  - pattern: |
      cat | ...
  - patterns:
    - pattern: |
        cat $ARG | ...
    - pattern-not: |
        cat ${$SEVERAL_FILES} | ...
  - pattern: |
      ... | cat
  - pattern: |
      ... | cat | ...
  # TODO: autofix, once we support $...ARGS
  message: "useless-cat 잠재적 결함 및 보안 이격율 정비 요망."
  metadata:
    references:
    - https://github.com/koalaman/shellcheck/wiki/SC2002
    category: best-practice
    technology:
    - bash
  severity: WARNING
  languages:
  - bash
