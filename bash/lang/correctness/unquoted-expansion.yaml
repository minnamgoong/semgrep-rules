rules:
- id: unquoted-variable-expansion-in-command
  languages:
  - bash
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: correctness
    technology:
    - bash
  patterns:
  - pattern-either:
    - pattern: '... ${$VAR} ...

        '
    - pattern: '... ...${$VAR}... ...

        '
  - metavariable-regex:
      metavariable: $VAR
      regex: '[*@0-9]|[A-Za-z].*'
  severity: INFO
- id: unquoted-command-substitution-in-command
  languages:
  - bash
  message: 안전하지 않은 코드 패턴이 발견되었습니다. 보안 취약점을 방지하기 위해 코드를 점검하고 수정해 주십시오.
  metadata:
    category: correctness
    technology:
    - bash
  patterns:
  - pattern-either:
    - pattern: '... $(...) ...

        '
    - pattern: '... ...$(...)... ...

        '
  - pattern-regex: '.*(\$\([^\(]|`).+([^\)]\)|`).*

      '
  severity: INFO
